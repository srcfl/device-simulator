<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Site plant sketch</title>
  <desc id="desc">Lumped AC site bus with pluggable Modelica physics, vendor register maps, and Lua drivers over Modbus TCP.</desc>
  <defs>
    <filter id="s" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#f8fafc"/>
  <text x="28" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Site plant  sketch</text>
  <text x="28" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">One AC node. Modelica module on a plug. Lua drivers never see the plant, only Modbus.</text>

  <!-- Exogenous -->
  <g filter="url(#s)">
    <rect x="28" y="78" width="150" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="103" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">Weather</text>
    <text x="103" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">GHI, T_amb</text>
  </g>
  <g filter="url(#s)">
    <rect x="198" y="78" width="150" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="273" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">House / EV</text>
    <text x="273" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">P_load, P_ev  e 0</text>
  </g>
  <g filter="url(#s)">
    <rect x="368" y="78" width="170" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="453" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">Lua setpoints</text>
    <text x="453" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">mode, cmd, watts, curtail</text>
  </g>

  <line x1="103" y1="142" x2="103" y2="188" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="273" y1="142" x2="273" y2="188" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="453" y1="142" x2="453" y2="188" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Plant box -->
  <rect x="28" y="188" width="610" height="268" rx="14" fill="#ecfdf5" stroke="#99f6e4"/>
  <text x="44" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">PLANT  ·  modelica/SiteEnergy.mo  =  internal/plant.NativeSite</text>
  <text x="44" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0f766e">flow P into component · 0 = £ inv.P + load.P + ev.P + grid.P</text>

  <!-- Units -->
  <g filter="url(#s)">
    <rect x="48" y="244" width="168" height="86" rx="10" fill="#fff" stroke="#5eead4"/>
    <text x="132" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#134e4a">Inverter 1</text>
    <text x="132" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">PV d 0    batt +charge</text>
    <text x="132" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">ac.P = P_pv + P_batt</text>
    <text x="132" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">der(SoC) = · P / E</text>
  </g>
  <g filter="url(#s)">
    <rect x="232" y="244" width="168" height="86" rx="10" fill="#fff" stroke="#5eead4"/>
    <text x="316" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#134e4a">Inverter N</text>
    <text x="316" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">same terminal</text>
    <text x="316" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">EMS follows Lua</text>
    <text x="316" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">mode 0 = site slack</text>
  </g>
  <g filter="url(#s)">
    <rect x="416" y="244" width="100" height="86" rx="10" fill="#fff" stroke="#5eead4"/>
    <text x="466" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#134e4a">Load</text>
    <text x="466" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">P e 0</text>
  </g>
  <g filter="url(#s)">
    <rect x="532" y="244" width="82" height="86" rx="10" fill="#fff" stroke="#5eead4"/>
    <text x="573" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#134e4a">EV</text>
    <text x="573" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">P e 0</text>
  </g>

  <!-- Bus -->
  <circle cx="333" cy="372" r="22" fill="#0f766e"/>
  <text x="333" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#fff">BUS</text>
  <line x1="132" y1="330" x2="318" y2="358" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrg)"/>
  <line x1="316" y1="330" x2="333" y2="350" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrg)"/>
  <line x1="466" y1="330" x2="350" y2="358" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrg)"/>
  <line x1="573" y1="330" x2="352" y2="364" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrg)"/>

  <g filter="url(#s)">
    <rect x="232" y="404" width="200" height="36" rx="8" fill="#fff" stroke="#0f766e"/>
    <text x="332" y="427" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#134e4a">Grid slack  ·  P_meter = grid.P</text>
  </g>
  <line x1="333" y1="394" x2="333" y2="404" stroke="#0f766e" stroke-width="1.6"/>

  <!-- Plug -->
  <rect x="48" y="408" width="168" height="32" rx="8" fill="#fff" stroke="#99f6e4"/>
  <text x="132" y="428" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0f766e">plug: NativeSite | FMU</text>

  <!-- Facade -->
  <rect x="662" y="188" width="290" height="268" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="678" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">VENDOR FACADE</text>
  <text x="678" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3b82f6">no physics · addresses / scale / endian</text>

  <g filter="url(#s)">
    <rect x="678" y="244" width="258" height="52" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="807" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">semantic names</text>
    <text x="807" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">pv_power  battery_soc  meter_power</text>
  </g>
  <g filter="url(#s)">
    <rect x="678" y="308" width="258" height="52" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="807" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Sungrow / Huawei / &</text>
    <text x="807" y="346" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">internal/modbus/devices</text>
  </g>
  <g filter="url(#s)">
    <rect x="678" y="372" width="258" height="52" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="807" y="394" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Modbus TCP</text>
    <text x="807" y="410" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">FC 03/04/06/10  ·  unit 1</text>
  </g>

  <line x1="638" y1="322" x2="678" y2="270" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="648" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">watts</text>

  <!-- Lua -->
  <g filter="url(#s)">
    <rect x="662" y="478" width="290" height="86" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="807" y="506" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">srcfl/device-drivers</text>
    <text x="807" y="524" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c2410c">sungrow.lua  ·  driver_poll / driver_command</text>
    <text x="807" y="542" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#9a3412">emit(pv, battery, meter)  ·  never HTTP</text>
  </g>
  <line x1="807" y1="424" x2="807" y2="478" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Clock -->
  <g filter="url(#s)">
    <rect x="28" y="478" width="610" height="86" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="44" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Site clock  ·  calculateAndUpdateMeter</text>
    <text x="44" y="526" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Scenario Physical plant: one StepSite(dt) per tick, including time acceleration.</text>
    <text x="44" y="544" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Master assigns mode-0 battery slack from live Lua writes  not inside the FMU.</text>
  </g>
</svg>

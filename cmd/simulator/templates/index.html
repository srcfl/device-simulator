<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Simulator - Don't Panic</title>
    <link rel="icon" type="image/png" href="/static/app-icon.png">

    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/protocols/modbus.css">
    <link rel="stylesheet" href="/static/css/protocols/mqtt.css">
    <link rel="stylesheet" href="/static/css/protocols/ocpp.css">

    <!-- Application Scripts (must load before Alpine) -->
    <script src="/static/js/stores.js"></script>
    <script src="/static/js/components.js"></script>

    <!-- Alpine.js (bundled locally for offline/desktop support) -->
    <script defer src="/static/js/alpine.min.js"></script>
</head>
<body x-data x-init="$store.app.init()">
    <!-- Top Site Tabs Bar -->
    <header class="site-header" x-data="siteTabs()" @dblclick="window.runtime?.WindowToggleMaximise()">
        <div class="site-header-leading">
            <button class="docs-header-btn"
                    @click="window.location.href = '/docs'"
                    title="Documentation">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/>
                    <path d="M8 6h8"/>
                    <path d="M8 10h8"/>
                    <path d="M8 14h5"/>
                </svg>
            </button>
            <button class="settings-header-btn"
                    @click="$store.app.showSettingsModal = true"
                    title="Settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
        <div class="site-header-tabs">
            <template x-for="site in $store.site.sites" :key="site.id">
                <div class="site-header-tab"
                     :class="{ 'active': $store.site.selectedId === site.id }"
                     @click="$store.site.selectSite(site.id); $store.app.selectedId = null;">
                    <svg class="site-header-tab-icon lucide-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                    <span class="site-header-tab-name" x-text="site.name"></span>
                    <button class="site-header-tab-close"
                            x-show="$store.site.sites.length > 1"
                            @click.stop="deleteSiteTab(site.id)"
                            title="Delete site">×</button>
                </div>
            </template>
            <button class="site-header-tab-add" x-show="$store.site.sites.length < 5" @click="createNewSite()" title="Add new site">+</button>
        </div>
        <div class="site-header-actions">
            <img src="/static/icons/Sourceful-Simulator-Green.svg" alt="Sourceful" class="site-header-logo" style="height: 18px; margin-right: 4px;" />
            <button class="update-check-btn"
                    @click="$store.app.showUpdateModal = true; $store.app.checkForUpdate()"
                    :class="{ 'checking': $store.app.updateChecking, 'has-update': $store.app.updateAvailable }"
                    :title="$store.app.updateChecking ? 'Checking...' : ($store.app.updateAvailable ? `Update available: v${$store.app.updateInfo?.latest_version}` : `v${$store.app.version} - Click to check for updates`)">
                <svg x-show="!$store.app.updateChecking" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M21 21v-5h-5"/>
                </svg>
                <svg x-show="$store.app.updateChecking" class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Warnings Banner -->
    <template x-if="$store.app.warnings.length > 0">
        <div class="warning-banner">
            <div class="warning-banner-content">
                <div class="warning-list">
                    <template x-for="(w, idx) in $store.app.warnings" :key="idx">
                        <div class="warning-item" x-text="w"></div>
                    </template>
                </div>
                <button class="warning-dismiss" @click="$store.app.clearWarnings()">Dismiss</button>
            </div>
        </div>
    </template>

    <!-- App Container - Top Row + Sidebar/Main -->
    <div class="app-container">
        <!-- Site Top Row (Clock + Phase) -->
        <template x-if="$store.site.selectedId && $store.site.data">
            <div class="site-top-row" x-data="phaseVisualization()">
                <div class="site-top-left">
                    <div class="site-top-settings" @click="openSettingsModal()" title="Site Settings">
                        <span class="site-top-settings-label">Site Settings</span>
                        <svg class="settings-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </div>
                    <div class="site-simulation-controls" x-data="siteSimulationControls()">
                        <div class="sim-control-header compact">
                            <div class="sim-clock compact">
                                <div class="sim-clock-time" x-text="clockTime"></div>
                                <div class="sim-clock-date" x-text="clockDate"></div>
                            </div>
                            <button class="sim-reset-btn compact"
                                    :disabled="resettingClock"
                                    @click="resetClock()"
                                    title="Reset clock to now">
                                Now
                            </button>
                            <div class="sim-control-actions compact">
                                <div class="sim-speed" @click.window="speedOpen = false">
                                    <button class="sim-speed-btn" @click.stop="speedOpen = !speedOpen">
                                        <span x-text="speedLabel"></span>
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </button>
                                    <div class="sim-speed-menu" x-show="speedOpen" x-transition @click.stop>
                                        <template x-for="opt in speedOptions" :key="opt.value">
                                            <button class="sim-speed-option"
                                                    :class="{ 'active': localTimeMultiplier === opt.value }"
                                                    @click="selectSpeed(opt.value)">
                                                <span x-text="opt.label"></span>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                                <button class="sim-play-btn compact"
                                        :class="{ 'running': $store.site.data?.sim_running }"
                                        @click="$store.site.toggleSimulation()"
                                        :title="$store.site.data?.sim_running ? 'Stop Simulation' : 'Start Simulation'">
                                    <template x-if="!$store.site.data?.sim_running">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                            <polygon points="5 3 19 12 5 21 5 3"/>
                                        </svg>
                                    </template>
                                    <template x-if="$store.site.data?.sim_running">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                            <rect x="6" y="4" width="4" height="16"/>
                                            <rect x="14" y="4" width="4" height="16"/>
                                        </svg>
                                    </template>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="site-top-dashboards">
                        <div class="site-dashboard-item site-load-sidebar-item"
                             :class="{ 'active': $store.app.selectedView === 'site_load' }"
                             @click="$store.app.selectSiteLoad()"
                             x-data="{
                                 formatSidebarPower(w) {
                                     if (Math.abs(w) >= 1000) return (w/1000).toFixed(1) + ' kW';
                                     return Math.round(w) + ' W';
                                 },
                                 getScenarioBadge(key) {
                                     const icons = { static: '📌', gaming_family: '🎮', old_couple: '👴', weed_factory: '🌿', work_from_home: '💻', night_owl: '🦉' };
                                     return icons[key] || '📊';
                                 }
                             }">
                            <svg class="site-load-icon site-dashboard-icon lucide-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 12V8.964" />
                                <path d="M14 12V8.964" />
                                <path d="M15 12a1 1 0 0 1 1 1v2a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2a1 1 0 0 1 1-1z" />
                                <path d="M8.5 21H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2v-2" />
                            </svg>
                            <div class="site-load-info site-dashboard-info">
                                <span class="site-load-name">Load</span>
                                <span class="site-load-value" x-text="formatSidebarPower($store.site.data?.base_load_w || 0)"></span>
                            </div>
                            <span class="site-load-scenario-badge" x-show="$store.site.data?.load_scenario"
                                  x-text="getScenarioBadge($store.site.data?.load_scenario)"></span>
                        </div>
                        <div class="site-dashboard-item site-overview-sidebar-item"
                             :class="{ 'active': !$store.app.selectedId && $store.app.selectedView !== 'site_load' }"
                             @click="$store.app.selectedId = null; $store.app.selectedView = null; $store.site.ensureRefreshing()">
                            <svg class="site-dashboard-icon lucide-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                                <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            </svg>
                            <div class="site-dashboard-info">
                                <span class="site-dashboard-name">Overview</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="site-top-right">
                    <div class="site-top-panel">
                        <div class="section">

                            <!-- Phase Bars -->
                            <div class="phase-visualization">
                                <div class="phase-bar-container">
                                    <div class="fuse-toggle" :class="{ 'blown': fuseBlown.l1 }" @click="toggleFuse('l1')" title="Click to toggle fuse">
                                        <div class="fuse-toggle-indicator"></div>
                                    </div>
                                    <div class="phase-label">L1</div>
                                    <div class="phase-bar-track bidirectional">
                                        <div class="center-line"></div>
                                        <div class="fuse-limit-marker export"></div>
                                        <div class="fuse-limit-marker import"></div>
                                        <div class="phase-bar-fill bidirectional" :style="getBidirectionalBarStyle(getPhasePowers().l1, fuseBlown.l1)"></div>
                                    </div>
                                    <div class="phase-value-stack">
                                        <div class="phase-value" :class="{ 'blown': fuseBlown.l1 }" x-text="formatPhasePower(getPhasePowers().l1)"></div>
                                        <div class="phase-countdown"
                                             x-show="hasFuseCountdown('l1')"
                                             :class="getFuseCountdownClass('l1')"
                                             :title="getFuseCountdownTitle('l1')"
                                             x-text="getFuseCountdownLabel('l1')"></div>
                                    </div>
                                </div>
                                <div class="phase-bar-container">
                                    <div class="fuse-toggle" :class="{ 'blown': fuseBlown.l2 }" @click="toggleFuse('l2')" title="Click to toggle fuse">
                                        <div class="fuse-toggle-indicator"></div>
                                    </div>
                                    <div class="phase-label">L2</div>
                                    <div class="phase-bar-track bidirectional">
                                        <div class="center-line"></div>
                                        <div class="fuse-limit-marker export"></div>
                                        <div class="fuse-limit-marker import"></div>
                                        <div class="phase-bar-fill bidirectional" :style="getBidirectionalBarStyle(getPhasePowers().l2, fuseBlown.l2)"></div>
                                    </div>
                                    <div class="phase-value-stack">
                                        <div class="phase-value" :class="{ 'blown': fuseBlown.l2 }" x-text="formatPhasePower(getPhasePowers().l2)"></div>
                                        <div class="phase-countdown"
                                             x-show="hasFuseCountdown('l2')"
                                             :class="getFuseCountdownClass('l2')"
                                             :title="getFuseCountdownTitle('l2')"
                                             x-text="getFuseCountdownLabel('l2')"></div>
                                    </div>
                                </div>
                                <div class="phase-bar-container">
                                    <div class="fuse-toggle" :class="{ 'blown': fuseBlown.l3 }" @click="toggleFuse('l3')" title="Click to toggle fuse">
                                        <div class="fuse-toggle-indicator"></div>
                                    </div>
                                    <div class="phase-label">L3</div>
                                    <div class="phase-bar-track bidirectional">
                                        <div class="center-line"></div>
                                        <div class="fuse-limit-marker export"></div>
                                        <div class="fuse-limit-marker import"></div>
                                        <div class="phase-bar-fill bidirectional" :style="getBidirectionalBarStyle(getPhasePowers().l3, fuseBlown.l3)"></div>
                                    </div>
                                    <div class="phase-value-stack">
                                        <div class="phase-value" :class="{ 'blown': fuseBlown.l3 }" x-text="formatPhasePower(getPhasePowers().l3)"></div>
                                        <div class="phase-countdown"
                                             x-show="hasFuseCountdown('l3')"
                                             :class="getFuseCountdownClass('l3')"
                                             :title="getFuseCountdownTitle('l3')"
                                             x-text="getFuseCountdownLabel('l3')"></div>
                                    </div>
                                </div>
                                <!-- Scale + legend row -->
                                <div class="phase-bar-scale">
                                    <div class="scale-spacer"></div>
                                    <div class="scale-track">
                                        <span class="scale-label export" x-text="`${$store.site.data?.fuse_size || 16}A`"></span>
                                        <span class="scale-label center">0</span>
                                        <span class="scale-label import" x-text="`${$store.site.data?.fuse_size || 16}A`"></span>
                                    </div>
                                    <div class="scale-spacer-end"></div>
                                </div>
                                <div class="phase-legend">
                                    <span class="fuse-indicator clickable" @click="openSettingsModal()" title="Open Site Settings">
                                        <span class="fuse-marker-icon"></span>
                                        <span x-text="`Fuse (${$store.site.data?.fuse_size || 16}A)`"></span>
                                        <span class="fuse-profile-label" x-text="'· ' + getFuseProfileLabel()"></span>
                                    </span>
                                    <span class="meter-total" :class="{ 'exporting': meterPower < 0 }" x-text="formatMeterPower()"></span>
                                </div>
                            </div>

                            <!-- Settings Modal -->
                            <template x-if="showSettingsModal">
                                <div class="site-settings-modal-backdrop" @click="closeSettingsModal()">
                                    <div class="site-settings-modal" @click.stop>
                                        <div class="modal-header">
                                            <h3>Site Settings</h3>
                                            <button class="modal-close" @click="closeSettingsModal()">×</button>
                                        </div>
                                        <div class="modal-info">Settings are stored locally in your browser</div>
                                        <div class="modal-body">
                                            <div class="modal-field">
                                                <label>Site Name</label>
                                                <input type="text"
                                                       x-model="localSiteName"
                                                       @focus="onSiteNameFocus()"
                                                       @blur="onSiteNameBlur()">
                                            </div>
                                            <div class="modal-field">
                                                <label>Fuse Size</label>
                                                <select x-model.number="localFuseSize"
                                                        @change="onFuseSizeChange($event.target.value)">
                                                    <option value="10">10 A</option>
                                                    <option value="16">16 A</option>
                                                    <option value="20">20 A</option>
                                                    <option value="25">25 A</option>
                                                    <option value="32">32 A</option>
                                                </select>
                                            </div>
                                            <div class="modal-field">
                                                <label>Fuse Profile</label>
                                                <select x-model="localFuseProfile"
                                                        @change="onFuseProfileChange($event.target.value)">
                                                    <option value="manual">Manual (no auto trip)</option>
                                                    <option value="iec_gg">IEC 60269 gG/gL (general purpose)</option>
                                                    <option value="iec_gm">IEC 60269 gM (motor, dual-rated) - UK common</option>
                                                    <option value="iec_am">IEC 60269 aM (motor, short-circuit)</option>
                                                    <option value="iec_gr">IEC 60269 gR (semiconductor, fast)</option>
                                                    <option value="iec_gs">IEC 60269 gS (semiconductor, full-range)</option>
                                                </select>
                                            </div>
                                            <div class="modal-field-group">
                                                <label>Phase Distribution</label>
                                                <div class="phase-inputs">
                                                    <div class="phase-input">
                                                        <span>L1</span>
                                                        <input type="number" step="0.01" min="0" max="1"
                                                               :value="localPhaseFactors.l1"
                                                               @focus="onPhaseFactorFocus()"
                                                               @blur="onPhaseFactorBlur()"
                                                               @input="localPhaseFactors.l1 = parseFloat($event.target.value) || 0">
                                                    </div>
                                                    <div class="phase-input">
                                                        <span>L2</span>
                                                        <input type="number" step="0.01" min="0" max="1"
                                                               :value="localPhaseFactors.l2"
                                                               @focus="onPhaseFactorFocus()"
                                                               @blur="onPhaseFactorBlur()"
                                                               @input="localPhaseFactors.l2 = parseFloat($event.target.value) || 0">
                                                    </div>
                                                    <div class="phase-input">
                                                        <span>L3</span>
                                                        <input type="number" step="0.01" min="0" max="1"
                                                               :value="localPhaseFactors.l3"
                                                               @focus="onPhaseFactorFocus()"
                                                               @blur="onPhaseFactorBlur()"
                                                               @input="localPhaseFactors.l3 = parseFloat($event.target.value) || 0">
                                                    </div>
                                                </div>
                                                <div class="phase-sum" :class="{ 'invalid': !isPhaseFactorsValid() }">
                                                    Sum: <span x-text="(localPhaseFactors.l1 + localPhaseFactors.l2 + localPhaseFactors.l3).toFixed(3)"></span>
                                                    <span x-show="!isPhaseFactorsValid()" class="error-hint">(must equal 1.0)</span>
                                                </div>
                                            </div>
                                            <div class="modal-field">
                                                <label>P1 Update Mode</label>
                                                <div class="p1-mode-toggle">
                                                    <button class="p1-mode-btn" :class="{ 'active': ($store.site.data?.p1_mode || 'direct') === 'direct' }"
                                                            @click="$store.site.setP1Mode('direct')">Direct</button>
                                                    <button class="p1-mode-btn" :class="{ 'active': ($store.site.data?.p1_mode || 'direct') === '1s' }"
                                                            @click="$store.site.setP1Mode('1s')">1s</button>
                                                    <button class="p1-mode-btn" :class="{ 'active': ($store.site.data?.p1_mode || 'direct') === '10s' }"
                                                            @click="$store.site.setP1Mode('10s')">10s</button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button class="btn btn-secondary" @click="closeSettingsModal()">Cancel</button>
                                            <button class="btn btn-primary" :disabled="!isPhaseFactorsValid()" @click="savePhaseFactors()">Save</button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <div class="app-body">
        <!-- Sidebar -->
        <aside class="sidebar">

        <!-- Simulator List - filtered by selected site -->
        <div class="simulator-list" id="simulatorList">
            <template x-if="!$store.site.selectedId">
                <div class="no-simulators">Select a site to view devices.</div>
            </template>

            <template x-if="$store.site.selectedId && $store.app.getSiteSimulators().length === 0">
                <div class="no-simulators">No devices in this site.<br>Use the "+" card in the site overview to add one.</div>
            </template>

            <template x-for="sim in $store.app.getSiteSortedSimulators()" :key="sim.id">
                <div class="sim-item"
                     :class="{ 'active': $store.app.selectedId === sim.id, 'bound-meter': $store.site.isBoundMeter(sim.id), 'device-off': !sim.running }"
                     @click="$store.app.selectSimulator(sim.id, sim.protocol)">

                    <button class="sim-delete"
                            x-show="!$store.site.isBoundMeter(sim.id)"
                            @click.stop="$store.app.deleteSimulator(sim.id, sim.serial)"
                            title="Delete">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                    </button>

                    <div class="sim-title-row">
                        <template x-if="sim.category === 'inverter'">
                            <svg class="sim-category-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
                                <path d="M12.667 8 10 12h4l-2.667 4" />
                            </svg>
                        </template>
                        <template x-if="sim.category === 'energy_meter'">
                            <svg class="sim-category-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="m12 14 4-4" />
                                <path d="M3.34 19a10 10 0 1 1 17.32 0" />
                            </svg>
                        </template>
                        <template x-if="sim.category === 'v2x_charger' || sim.category === 'ocpp_charger'">
                            <svg class="sim-category-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0v-6.998a2 2 0 0 0-.59-1.42L18 5" />
                                <path d="M14 21V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v16" />
                                <path d="M2 21h13" />
                                <path d="M3 7h11" />
                                <path d="m9 11-2 3h3l-2 3" />
                            </svg>
                        </template>
                        <span class="sim-serial" x-text="sim.serial"></span>
                        <span class="protocol-badge" :class="sim.protocol" x-text="sim.protocol"></span>
                    </div>
                    <div class="sim-address">
                        <template x-if="sim.protocol === 'modbus'">
                            <template x-if="sim.port">
                                <span x-text="`${sim.mdns_hostname ? sim.mdns_hostname + '.local' : $store.app.localIP}:${sim.port + $store.app.modbusDisplayOffset}`"></span>
                            </template>
                        </template>
                        <template x-if="sim.protocol === 'mqtt'">
                            <template x-if="sim.port">
                                <span x-text="`${sim.mdns_hostname ? sim.mdns_hostname + '.local' : $store.app.localIP}:${sim.port + $store.app.mqttDisplayOffset}`"></span>
                            </template>
                        </template>
                        <template x-if="sim.protocol === 'ocpp'">
                            <template x-if="sim.port">
                                <span x-text="`${sim.mdns_hostname ? sim.mdns_hostname + '.local' : $store.app.localIP}:${sim.port + $store.app.ocppDisplayOffset}`"></span>
                            </template>
                        </template>
                        <template x-if="!sim.port">
                            <span class="sim-port-unassigned">Not allocated</span>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Sidebar Add Device -->
            <div class="sidebar-add-device" x-show="$store.site.selectedId">
                <button class="sidebar-add-btn" @click="$store.app.openAddDeviceModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add Device
                </button>
            </div>
        </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Content Area -->
            <div class="main-content">
                <!-- Site Load Dashboard - shown when Site Load is selected -->
                <template x-if="$store.site.selectedId && $store.app.selectedView === 'site_load'">
                    <div class="site-load-dashboard" x-data="siteLoadControls()">
                        <div class="dashboard-header">
                            <h2 class="dashboard-title">Site Load</h2>
                            <span class="dashboard-total" x-text="formatPower(getTotalPower())"></span>
                        </div>

                    <!-- Scenario Selector -->
                    <div class="section">
                        <div class="section-title">Load Profile</div>
                        <div class="scenario-selector">
                            <template x-for="s in scenarios" :key="s.key">
                                <div class="scenario-option"
                                     :class="{ 'active': activeScenario === s.key }"
                                     @click="onScenarioChange(s.key)">
                                    <span class="scenario-option-icon" x-text="getScenarioIcon(s.key)"></span>
                                    <span class="scenario-option-name" x-text="s.name"></span>
                                    <span class="scenario-option-desc" x-text="s.description"></span>
                                    <span class="scenario-option-peak" x-text="'Peak: ' + formatPower(s.peak_load)"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Phase Load Controls -->
                    <div class="section">
                        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>Phase Loads</span>
                            <button class="link-toggle compact" :class="{ 'linked': loadLinked }"
                                    @click="toggleLinked()"
                                    :disabled="shouldDisableSliders()"
                                    :title="loadLinked ? 'Unlink phases (adjust individually)' : 'Link phases (adjust together)'">
                                <svg x-show="loadLinked" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                </svg>
                                <svg x-show="!loadLinked" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/>
                                    <path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/>
                                    <line x1="8" y1="2" x2="8" y2="5"/>
                                    <line x1="2" y1="8" x2="5" y2="8"/>
                                    <line x1="16" y1="19" x2="16" y2="22"/>
                                    <line x1="19" y1="16" x2="22" y2="16"/>
                                </svg>
                            </button>
                        </div>

                        <div class="phase-load-grid">
                            <!-- L1 -->
                            <div class="phase-load-card">
                                <div class="phase-load-card-header">
                                    <span class="phase-load-card-label">L1</span>
                                    <span class="phase-load-card-value" x-text="formatPower(localLoads.l1)"></span>
                                </div>
                                <input type="range" class="phase-load-slider large"
                                       min="0" max="5000" step="50"
                                       :value="localLoads.l1"
                                       :disabled="shouldDisableSliders()"
                                       :class="{ 'disabled': shouldDisableSliders() }"
                                       @input="onPhaseSliderInput('l1', $event.target.value)">
                            </div>

                            <!-- L2 -->
                            <div class="phase-load-card">
                                <div class="phase-load-card-header">
                                    <span class="phase-load-card-label">L2</span>
                                    <span class="phase-load-card-value" x-text="formatPower(localLoads.l2)"></span>
                                </div>
                                <input type="range" class="phase-load-slider large"
                                       min="0" max="5000" step="50"
                                       :value="localLoads.l2"
                                       :disabled="shouldDisableSliders()"
                                       :class="{ 'disabled': shouldDisableSliders() }"
                                       @input="onPhaseSliderInput('l2', $event.target.value)">
                            </div>

                            <!-- L3 -->
                            <div class="phase-load-card">
                                <div class="phase-load-card-header">
                                    <span class="phase-load-card-label">L3</span>
                                    <span class="phase-load-card-value" x-text="formatPower(localLoads.l3)"></span>
                                </div>
                                <input type="range" class="phase-load-slider large"
                                       min="0" max="5000" step="50"
                                       :value="localLoads.l3"
                                       :disabled="shouldDisableSliders()"
                                       :class="{ 'disabled': shouldDisableSliders() }"
                                       @input="onPhaseSliderInput('l3', $event.target.value)">
                            </div>
                        </div>

                    </div>
                </div>
            </template>

            <!-- Site View - shown when site is selected but no simulator or site_load is selected -->
            <template x-if="$store.site.selectedId && $store.site.data && !$store.app.selectedId && $store.app.selectedView !== 'site_load'">
                <div x-data="siteView()">
                <!-- Member Devices Section -->
                <div class="section" x-data="siteMemberControls()">
                    <div class="member-grid">
                        <!-- Home Load Card - synced with Site Load dashboard -->
                        <div class="member-card load">
                            <div class="member-header">
                                <div class="member-info">
                                    <span class="member-serial">Home Load</span>
                                    <span class="protocol-badge load">load</span>
                                </div>
                                <div class="member-actions">
                                    <button class="member-open-btn" @click.stop="$store.app.selectSiteLoad()" title="Open Site Load dashboard">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                            <polyline points="15 3 21 3 21 9"/>
                                            <line x1="10" y1="14" x2="21" y2="3"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div class="member-power">
                                <span class="power-label">Consumption</span>
                                <span class="power-value" style="color: var(--color-warning);"
                                      x-text="formatLoadPower(getHomeLoadTotal())"></span>
                            </div>

                            <div class="member-controls load-controls" @click.stop>
                                <div class="member-control-row load-profile-row">
                                    <span class="control-label">Profile</span>
                                    <select class="site-load-select member-load-select"
                                            x-effect="let v = homeLoadScenario, n = loadScenarios.length; $nextTick(() => $el.value = v)"
                                            @change="setHomeLoadScenario($event.target.value)">
                                        <template x-for="s in loadScenarios" :key="s.key">
                                            <option :value="s.key" x-text="`${getLoadScenarioIcon(s.key)} ${s.name}`"></option>
                                        </template>
                                    </select>
                                </div>

                                <div class="member-load-phases">
                                    <div class="phase-load-row compact with-link">
                                        <span class="phase-load-label">L1</span>
                                        <button class="link-toggle micro"
                                                :class="{ 'linked': homeLoadLinks.l1 }"
                                                :disabled="isSiteSimulating()"
                                                @click.stop="toggleHomeLoadLink('l1')"
                                                :title="homeLoadLinks.l1 ? 'Unlink this phase' : 'Link this phase'">
                                            <svg x-show="homeLoadLinks.l1" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                            </svg>
                                            <svg x-show="!homeLoadLinks.l1" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/>
                                                <path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/>
                                                <line x1="8" y1="2" x2="8" y2="5"/>
                                                <line x1="2" y1="8" x2="5" y2="8"/>
                                                <line x1="16" y1="19" x2="16" y2="22"/>
                                                <line x1="19" y1="16" x2="22" y2="16"/>
                                            </svg>
                                        </button>
                                        <input type="range" class="phase-load-slider"
                                               min="0" max="5000" step="50"
                                               :value="homeLoads.l1"
                                               :disabled="isSiteSimulating()"
                                               :class="{ 'disabled': isSiteSimulating() }"
                                               @input="onHomePhaseInput('l1', $event.target.value)">
                                        <span class="phase-load-value" x-text="formatLoadPower(homeLoads.l1)"></span>
                                    </div>
                                    <div class="phase-load-row compact with-link">
                                        <span class="phase-load-label">L2</span>
                                        <button class="link-toggle micro"
                                                :class="{ 'linked': homeLoadLinks.l2 }"
                                                :disabled="isSiteSimulating()"
                                                @click.stop="toggleHomeLoadLink('l2')"
                                                :title="homeLoadLinks.l2 ? 'Unlink this phase' : 'Link this phase'">
                                            <svg x-show="homeLoadLinks.l2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                            </svg>
                                            <svg x-show="!homeLoadLinks.l2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/>
                                                <path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 0 0 0 6.95 0l1.71-1.71"/>
                                                <line x1="8" y1="2" x2="8" y2="5"/>
                                                <line x1="2" y1="8" x2="5" y2="8"/>
                                                <line x1="16" y1="19" x2="16" y2="22"/>
                                                <line x1="19" y1="16" x2="22" y2="16"/>
                                            </svg>
                                        </button>
                                        <input type="range" class="phase-load-slider"
                                               min="0" max="5000" step="50"
                                               :value="homeLoads.l2"
                                               :disabled="isSiteSimulating()"
                                               :class="{ 'disabled': isSiteSimulating() }"
                                               @input="onHomePhaseInput('l2', $event.target.value)">
                                        <span class="phase-load-value" x-text="formatLoadPower(homeLoads.l2)"></span>
                                    </div>
                                    <div class="phase-load-row compact with-link">
                                        <span class="phase-load-label">L3</span>
                                        <button class="link-toggle micro"
                                                :class="{ 'linked': homeLoadLinks.l3 }"
                                                :disabled="isSiteSimulating()"
                                                @click.stop="toggleHomeLoadLink('l3')"
                                                :title="homeLoadLinks.l3 ? 'Unlink this phase' : 'Link this phase'">
                                            <svg x-show="homeLoadLinks.l3" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                            </svg>
                                            <svg x-show="!homeLoadLinks.l3" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 0 0 0-6.95 0l-1.72 1.71"/>
                                                <path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 0 0 0 6.95 0l1.71-1.71"/>
                                                <line x1="8" y1="2" x2="8" y2="5"/>
                                                <line x1="2" y1="8" x2="5" y2="8"/>
                                                <line x1="16" y1="19" x2="16" y2="22"/>
                                                <line x1="19" y1="16" x2="22" y2="16"/>
                                            </svg>
                                        </button>
                                        <input type="range" class="phase-load-slider"
                                               min="0" max="5000" step="50"
                                               :value="homeLoads.l3"
                                               :disabled="isSiteSimulating()"
                                               :class="{ 'disabled': isSiteSimulating() }"
                                               @input="onHomePhaseInput('l3', $event.target.value)">
                                        <span class="phase-load-value" x-text="formatLoadPower(homeLoads.l3)"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="member-footer">
                                <span class="status-indicator" :class="isSiteSimulating() ? 'simulating' : 'running'"></span>
                                <span class="status-text" x-text="isSiteSimulating() ? 'Simulating' : 'Online'"></span>
                            </div>
                        </div>

                        <!-- Inverter PV Cards -->
                        <template x-for="inv in getSiteInverters()" :key="'pv-' + inv.id">
                            <div class="member-card pv" :class="{ 'offline': !inv.running }">
                                <div class="member-header">
                                    <div class="member-info" @click="openSimulator(inv.id)" style="cursor: pointer;" title="Open full simulator view">
                                        <span class="member-serial" x-text="inv.serial + ' - Solar PV'"></span>
                                        <span class="protocol-badge pv">modbus</span>
                                    </div>
                                    <div class="member-actions">
                                        <div class="mini-toggle emu-toggle" :class="{ 'on': inv.running, 'loading': isToggleLocked('emu-' + inv.id) }"
                                             @click="toggleEmulator(inv.id)" title="Toggle emulation">
                                            <div class="mini-toggle-thumb"></div>
                                        </div>
                                        <button class="member-open-btn" @click="openSimulator(inv.id)" title="Open full view">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                                <polyline points="15 3 21 3 21 9"/>
                                                <line x1="10" y1="14" x2="21" y2="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="member-power">
                                    <span class="power-label">Generation</span>
                                    <span class="power-value" style="color: var(--color-primary);"
                                          x-text="formatInverterPvPower(inv)"></span>
                                </div>
                                <div class="member-controls">
                                    <div class="member-control-row load-profile-row">
                                        <span class="control-label">Profile</span>
                                        <select class="site-load-select member-load-select"
                                                :disabled="!inv.running"
                                                @change="setInverterScenario(inv.id, $event.target.value)"
                                                :value="getInverterScenario(inv)">
                                            <template x-for="s in pvScenarios" :key="s.value">
                                                <option :value="s.value" x-text="s.label"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="member-control-row">
                                        <span class="control-label">Power</span>
                                        <div class="mini-slider-container">
                                            <input type="range" class="mini-slider pv-power"
                                                   min="0" max="10000" step="100"
                                                   :value="inv.pv_power || 0"
                                                   :disabled="isSiteSimulating() || !inv.running"
                                                   :class="{ 'disabled': isSiteSimulating() || !inv.running }"
                                                   @change="setInverterPvPower(inv.id, parseInt($event.target.value))">
                                        </div>
                                        <span class="control-value" style="color: var(--color-primary);"
                                              x-text="formatInverterPvPower(inv)"></span>
                                    </div>
                                </div>
                                <div class="member-footer">
                                    <template x-if="isSiteSimulating()">
                                        <span class="status-indicator simulating"></span>
                                    </template>
                                    <template x-if="!isSiteSimulating()">
                                        <span class="status-indicator" :class="inv.running ? 'running' : ''"></span>
                                    </template>
                                    <span class="status-text" x-text="isSiteSimulating() ? 'Simulating' : (inv.running ? 'Online' : 'Offline')"></span>
                                    <button x-show="!inv.running" class="member-delete-btn"
                                            @click="$store.app.deleteSimulator(inv.id, inv.serial)"
                                            title="Delete simulator">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- Inverter Battery Cards -->
                        <template x-for="inv in getSiteInverters()" :key="'bat-' + inv.id">
                            <div class="member-card battery" :class="{ 'offline': !inv.running }">
                                <div class="member-header">
                                    <div class="member-info" @click="openSimulator(inv.id)" style="cursor: pointer;" title="Open full simulator view">
                                        <span class="member-serial" x-text="inv.serial + ' - Battery'"></span>
                                        <span class="protocol-badge battery">modbus</span>
                                    </div>
                                    <div class="member-actions">
                                        <div class="mini-toggle emu-toggle" :class="{ 'on': inv.running, 'loading': isToggleLocked('emu-' + inv.id) }"
                                             @click="toggleEmulator(inv.id)" title="Toggle emulation">
                                            <div class="mini-toggle-thumb"></div>
                                        </div>
                                        <button class="member-open-btn" @click="openSimulator(inv.id)" title="Open full view">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                                <polyline points="15 3 21 3 21 9"/>
                                                <line x1="10" y1="14" x2="21" y2="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="member-power">
                                    <span class="power-label">Power</span>
                                    <span class="power-value" :class="getInverterBatteryPowerClass(inv)"
                                          x-text="formatInverterBatteryPower(inv)"></span>
                                </div>
                                <div class="member-controls">
                                    <div class="member-control-row">
                                        <span class="control-label">SoC</span>
                                        <div class="mini-progress">
                                            <div class="mini-progress-fill battery" :style="`width: ${inv.soc || 0}%`"></div>
                                        </div>
                                        <span class="control-value" x-text="`${(inv.soc || 0).toFixed(0)}%`"></span>

                                    <div class="member-control-row">
                                        <span class="control-label">Power</span>

                                                   :disabled="isSiteSimulating() || !inv.running"
                                                   :class="{ 'disabled': isSiteSimulating() || !inv.running }"
                                                   @change="setInverterBatteryPower(inv.id, parseInt($event.target.value))">
                                        </div>
                                        <span class="control-value" :class="getInverterBatteryPowerClass(inv)"
                                              x-text="formatInverterBatteryPower(inv)"></span>
                                    </div>
                                </div>
                                <div class="member-footer">
                                    <span class="status-indicator" :class="inv.running ? 'running' : ''"></span>
                                    <span class="status-text" x-text="inv.running ? 'Online' : 'Offline'"></span>

                                            @click="$store.app.deleteSimulator(inv.id, inv.serial)"
                                            title="Delete simulator">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                    </button>
                                </div>

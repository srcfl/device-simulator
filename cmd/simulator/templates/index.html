<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Simulator - Don't Panic</title>

    <!-- CSS Modules -->
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/protocols/modbus.css">
    <link rel="stylesheet" href="/static/css/protocols/mqtt.css">
    <link rel="stylesheet" href="/static/css/protocols/ocpp.css">

    <!-- Application Scripts (must load before Alpine) -->
    <script src="/static/js/stores.js"></script>
    <script src="/static/js/components.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data x-init="$store.app.init()">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Device Simulator</h1>
            <p>Multi-Protocol Energy Devices</p>
        </div>

        <!-- Simulator List -->
        <div class="simulator-list" id="simulatorList">
            <template x-if="$store.app.simulators.length === 0">
                <div class="no-simulators">No emulators yet.<br>Click "+ Add Emulator" below.</div>
            </template>

            <template x-for="[cat, sims] in Object.entries($store.app.getGroupedSimulators())" :key="cat">
                <template x-if="sims.length > 0">
                    <div class="category-section">
                        <div class="category-header" @click="$store.app.toggleCategory(cat)">
                            <span class="category-icon" x-text="$store.app.categories[cat].icon"></span>
                            <span class="category-name" x-text="$store.app.categories[cat].name"></span>
                            <span class="category-count" x-text="sims.length"></span>
                        </div>
                        <div class="category-items" :class="{ 'collapsed': $store.app.categories[cat].collapsed }">
                            <template x-for="sim in sims" :key="sim.id">
                                <div class="sim-item"
                                     :class="{ 'active': $store.app.selectedId === sim.id, 'bound-meter': $store.site.isBoundMeter(sim.id) }"
                                     @click="$store.app.selectSimulator(sim.id, sim.protocol)">

                                    <button class="sim-delete"
                                            x-show="!$store.site.isBoundMeter(sim.id)"
                                            @click.stop="$store.app.deleteSimulator(sim.id, sim.serial)"
                                            title="Delete">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                        </svg>
                                    </button>

                                    <div class="sim-header">
                                        <template x-if="$store.site.isBoundMeter(sim.id)">
                                            <span class="bound-meter-badge">SITE METER</span>
                                        </template>
                                        <template x-if="!$store.site.isBoundMeter(sim.id)">
                                            <span class="sim-profile" :class="{ 'inactive': !sim.profile }"
                                                  x-text="sim.profile || 'no profile'"></span>
                                        </template>
                                        <span class="protocol-badge" :class="sim.protocol" x-text="sim.protocol"></span>
                                    </div>
                                    <div class="sim-serial" x-text="sim.serial"></div>
                                    <div class="sim-ports">
                                        <template x-if="sim.protocol === 'modbus'">
                                            <span x-text="`Modbus :${sim.port} | Unit ${sim.slave_id}`"></span>
                                        </template>
                                        <template x-if="sim.protocol === 'mqtt'">
                                            <span x-text="`MQTT :${sim.port + 10000}`"></span>
                                        </template>
                                        <template x-if="sim.protocol === 'ocpp'">
                                            <span x-text="`WS :${sim.port}`"></span>
                                        </template>
                                    </div>
                                    <div class="sim-stats">
                                        <template x-if="sim.running">
                                            <template x-if="sim.protocol === 'modbus' && sim.category === 'energy_meter'">
                                                <span :style="(sim.meter || 0) >= 0 ? 'color: var(--color-warning);' : 'color: var(--color-primary);'"
                                                      x-text="`${(sim.meter || 0) >= 0 ? '↓' : '↑'} ${Math.abs(sim.meter || 0).toFixed(0)}W`"></span>
                                            </template>
                                            <template x-if="sim.protocol === 'modbus' && sim.category !== 'energy_meter'">
                                                <span x-text="`PV ${sim.pv_power?.toFixed(0) || 0}W | SoC ${sim.soc?.toFixed(0) || 0}%`"></span>
                                            </template>
                                            <template x-if="sim.protocol === 'mqtt'">
                                                <span x-text="`${sim.session_state || 'IDLE'} | ${sim.power_ac?.toFixed(0) || 0}W | SoC ${sim.soc?.toFixed(0) || 0}%`"></span>
                                            </template>
                                            <template x-if="sim.protocol === 'ocpp'">
                                                <span x-text="`${sim.connected ? 'Connected' : 'Disconnected'} | [${sim.connectors?.slice(1).map(c => c.status[0]).join('') || '?'}]`"></span>
                                            </template>
                                        </template>
                                        <template x-if="!sim.running">
                                            <span>Offline</span>
                                        </template>
                                    </div>
                                    <div class="sim-toggle" @click.stop>
                                        <div class="sim-toggle-track"
                                             :class="{ 'on': sim.running }"
                                             @click="$store.app.toggleEmulatorRunning(sim.id, sim.running)">
                                            <div class="sim-toggle-thumb"></div>
                                        </div>
                                        <span class="sim-toggle-label" :class="{ 'on': sim.running }"
                                              x-text="sim.running ? 'Online' : 'Offline'"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- Add Emulator -->
        <div style="padding: 0.5rem;">
            <button class="add-simulator-btn" @click="$store.app.toggleAddMenu()">+ Add Emulator</button>
            <div class="add-menu" :class="{ 'show': $store.app.addMenuOpen }">
                <div class="add-menu-title">Select Type</div>
                <button class="add-menu-btn" @click="$store.app.addSimulator('inverter')">⚡ Inverter (Modbus)</button>
                <button class="add-menu-btn" @click="$store.app.addSimulator('energy_meter')">📊 Energy Meter (Modbus)</button>
                <button class="add-menu-btn" @click="$store.app.addSimulator('v2x_charger')">🔋 V2X Charger (MQTT)</button>
                <button class="add-menu-btn" @click="$store.app.addSimulator('ocpp_charger')">🔌 OCPP Charger</button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <!-- Site Tab Bar -->
        <div class="site-tabs" x-data="siteTabs()">
            <div class="site-tabs-list">
                <template x-for="site in $store.site.sites" :key="site.id">
                    <div class="site-tab"
                         :class="{ 'active': $store.site.selectedId === site.id }"
                         @click="$store.site.selectSite(site.id); $store.app.selectedId = null;">
                        <span class="site-tab-icon">🏠</span>
                        <span class="site-tab-name" x-text="site.name"></span>
                        <span class="site-tab-status" :class="{ 'active': site.enabled }"></span>
                        <button class="site-tab-close"
                                x-show="$store.site.sites.length > 1"
                                @click.stop="deleteSiteTab(site.id)"
                                title="Close site">×</button>
                    </div>
                </template>
                <button class="site-tab-add" @click="createNewSite()" title="Add new site">+</button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="main-content">
            <!-- Site View - shown when site is selected but no simulator is selected -->
        <template x-if="$store.site.selectedId && $store.site.data && !$store.app.selectedId">
            <div x-data="siteView()">
                <!-- Phase Visualization Section -->
                <div class="section" x-data="phaseVisualization()">
                    <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Site Energy Balance</span>
                        <button class="settings-btn" @click="showSettingsModal = true" title="Site Settings">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Phase Bars -->
                    <div class="phase-visualization">
                        <div class="phase-bar-container">
                            <div class="fuse-toggle" :class="{ 'blown': fuseBlown.l1 }" @click="toggleFuse('l1')" title="Click to toggle fuse">
                                <div class="fuse-toggle-indicator"></div>
                            </div>
                            <div class="phase-label">L1</div>
                            <div class="phase-bar-track">
                                <div class="phase-bar-fill" :style="getPhaseBarStyle(getPhaseCurrents().l1, fuseBlown.l1)"></div>
                                <div class="fuse-limit-marker"></div>
                            </div>
                            <div class="phase-value" :class="{ 'blown': fuseBlown.l1 }" x-text="`${getPhaseCurrents().l1.toFixed(1)} A`"></div>
                        </div>
                        <div class="phase-bar-container">
                            <div class="fuse-toggle" :class="{ 'blown': fuseBlown.l2 }" @click="toggleFuse('l2')" title="Click to toggle fuse">
                                <div class="fuse-toggle-indicator"></div>
                            </div>
                            <div class="phase-label">L2</div>
                            <div class="phase-bar-track">
                                <div class="phase-bar-fill" :style="getPhaseBarStyle(getPhaseCurrents().l2, fuseBlown.l2)"></div>
                                <div class="fuse-limit-marker"></div>
                            </div>
                            <div class="phase-value" :class="{ 'blown': fuseBlown.l2 }" x-text="`${getPhaseCurrents().l2.toFixed(1)} A`"></div>
                        </div>
                        <div class="phase-bar-container">
                            <div class="fuse-toggle" :class="{ 'blown': fuseBlown.l3 }" @click="toggleFuse('l3')" title="Click to toggle fuse">
                                <div class="fuse-toggle-indicator"></div>
                            </div>
                            <div class="phase-label">L3</div>
                            <div class="phase-bar-track">
                                <div class="phase-bar-fill" :style="getPhaseBarStyle(getPhaseCurrents().l3, fuseBlown.l3)"></div>
                                <div class="fuse-limit-marker"></div>
                            </div>
                            <div class="phase-value" :class="{ 'blown': fuseBlown.l3 }" x-text="`${getPhaseCurrents().l3.toFixed(1)} A`"></div>
                        </div>
                        <div class="phase-legend">
                            <span class="fuse-indicator">
                                <span class="fuse-marker-icon"></span>
                                <span x-text="`Fuse limit (${$store.site.data?.fuse_size || 16}A)`"></span>
                            </span>
                            <span class="meter-total" :class="{ 'exporting': meterPower < 0 }" x-text="formatMeterPower()"></span>
                        </div>
                    </div>

                    <!-- Settings Modal -->
                    <template x-if="showSettingsModal">
                        <div class="site-settings-modal-backdrop" @click="showSettingsModal = false">
                            <div class="site-settings-modal" @click.stop>
                                <div class="modal-header">
                                    <h3>Site Settings</h3>
                                    <button class="modal-close" @click="showSettingsModal = false">×</button>
                                </div>
                                <div class="modal-info">Settings are stored locally in your browser</div>
                                <div class="modal-body">
                                    <div class="modal-field">
                                        <label>Site Name</label>
                                        <input type="text"
                                               :value="$store.site.data?.name || ''"
                                               @change="$store.site.updateConfig({ name: $event.target.value })">
                                    </div>
                                    <div class="modal-field">
                                        <label>Fuse Size</label>
                                        <select :value="$store.site.data?.fuse_size || 16"
                                                @change="$store.site.updateConfig({ fuse_size: parseInt($event.target.value) })">
                                            <option value="10">10 A</option>
                                            <option value="16">16 A</option>
                                            <option value="20">20 A</option>
                                            <option value="25">25 A</option>
                                            <option value="32">32 A</option>
                                        </select>
                                    </div>
                                    <div class="modal-field-group">
                                        <label>Phase Distribution</label>
                                        <div class="phase-inputs">
                                            <div class="phase-input">
                                                <span>L1</span>
                                                <input type="number" step="0.01" min="0" max="1"
                                                       :value="localPhaseFactors.l1"
                                                       @input="localPhaseFactors.l1 = parseFloat($event.target.value) || 0">
                                            </div>
                                            <div class="phase-input">
                                                <span>L2</span>
                                                <input type="number" step="0.01" min="0" max="1"
                                                       :value="localPhaseFactors.l2"
                                                       @input="localPhaseFactors.l2 = parseFloat($event.target.value) || 0">
                                            </div>
                                            <div class="phase-input">
                                                <span>L3</span>
                                                <input type="number" step="0.01" min="0" max="1"
                                                       :value="localPhaseFactors.l3"
                                                       @input="localPhaseFactors.l3 = parseFloat($event.target.value) || 0">
                                            </div>
                                        </div>
                                        <div class="phase-sum" :class="{ 'invalid': !isPhaseFactorsValid() }">
                                            Sum: <span x-text="(localPhaseFactors.l1 + localPhaseFactors.l2 + localPhaseFactors.l3).toFixed(3)"></span>
                                            <span x-show="!isPhaseFactorsValid()" class="error-hint">(must equal 1.0)</span>
                                        </div>
                                    </div>
                                    <div class="modal-field">
                                        <label>P1 Update Mode</label>
                                        <div class="p1-mode-toggle">
                                            <button class="p1-mode-btn" :class="{ 'active': ($store.site.data?.p1_mode || 'direct') === 'direct' }"
                                                    @click="$store.site.setP1Mode('direct')">Direct</button>
                                            <button class="p1-mode-btn" :class="{ 'active': ($store.site.data?.p1_mode || 'direct') === '1s' }"
                                                    @click="$store.site.setP1Mode('1s')">1s</button>
                                            <button class="p1-mode-btn" :class="{ 'active': ($store.site.data?.p1_mode || 'direct') === '10s' }"
                                                    @click="$store.site.setP1Mode('10s')">10s</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn btn-secondary" @click="showSettingsModal = false">Cancel</button>
                                    <button class="btn btn-primary" :disabled="!isPhaseFactorsValid()" @click="savePhaseFactors()">Save</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Member Devices Section -->
                <div class="section" x-data="siteMemberControls()">
                    <div class="section-title" style="display: flex; align-items: center; justify-content: space-between;">
                        <span>Member Devices</span>
                        <div x-data="{ showAddSim: false }" style="position: relative;">
                            <button class="btn btn-action" style="padding: 0.2rem 0.5rem; font-size: 0.7rem;"
                                    @click="showAddSim = !showAddSim">+ Add Device</button>
                            <div x-show="showAddSim" @click.away="showAddSim = false"
                                 style="position: absolute; right: 0; top: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 4px; padding: 0.5rem; min-width: 200px; z-index: 100;">
                                <template x-for="sim in getAvailableToAdd()" :key="sim.id">
                                    <div style="padding: 0.25rem 0.5rem; cursor: pointer; font-size: 0.75rem;"
                                         @click="addDevice(sim.id); showAddSim = false"
                                         class="add-menu-btn">
                                        <span x-text="`${sim.serial} (${sim.protocol})`"></span>
                                    </div>
                                </template>
                                <template x-if="getAvailableToAdd().length === 0">
                                    <div style="padding: 0.25rem; color: var(--text-muted); font-size: 0.75rem;">No available devices</div>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="member-grid">
                        <!-- Home Load - always present -->
                        <div class="member-card load">
                            <div class="member-header">
                                <div class="member-info">
                                    <span class="member-serial">Home Load</span>
                                    <span class="protocol-badge load">load</span>
                                </div>
                            </div>

                            <div class="member-power">
                                <span class="power-label">Consumption</span>
                                <span class="power-value" style="color: var(--color-warning);"
                                      x-text="formatLoadPower($store.site.data?.base_load_w || 0)"></span>
                            </div>

                            <div class="member-controls">
                                <div class="member-control-row">
                                    <span class="control-label">Power</span>
                                    <div class="mini-slider-container">
                                        <input type="range" class="mini-slider load-power"
                                               min="0" max="10000" step="100"
                                               :value="$store.site.data?.base_load_w || 0"
                                               @change="setBaseLoad(parseInt($event.target.value))">
                                    </div>
                                    <span class="control-value" style="color: var(--color-warning);"
                                          x-text="formatLoadPower($store.site.data?.base_load_w || 0)"></span>
                                </div>
                            </div>

                            <div class="member-footer">
                                <span class="status-indicator running"></span>
                                <span class="status-text">Always on</span>
                            </div>
                        </div>

                        <!-- Virtual PV Card (when meter is an inverter) -->
                        <template x-if="$store.site.isMeterInverter() && $store.site.data?.virtual_devices?.length > 0">
                            <div class="member-card pv" x-data="virtualDeviceControls()">
                                <div class="member-header">
                                    <div class="member-info">
                                        <span class="member-serial">Solar PV</span>
                                        <span class="protocol-badge pv">virtual</span>
                                    </div>
                                </div>
                                <div class="member-power">
                                    <span class="power-label">Generation</span>
                                    <span class="power-value" style="color: var(--color-primary);" x-text="formatPvPower()"></span>
                                </div>
                                <div class="member-controls">
                                    <div class="member-control-row">
                                        <span class="control-label">Power</span>
                                        <div class="mini-slider-container">
                                            <input type="range" class="mini-slider pv-power"
                                                   min="0" max="10000" step="100"
                                                   :value="pvPower"
                                                   :disabled="isSimulationRunning"
                                                   @input="onPvPowerInput($event.target.value)"
                                                   @change="onPvPowerChange($event.target.value)">
                                        </div>
                                        <span class="control-value" style="color: var(--color-primary);" x-text="formatPvPower()"></span>
                                    </div>
                                </div>
                                <div class="member-footer">
                                    <span class="status-indicator running"></span>
                                    <span class="status-text" x-text="isSimulationRunning ? 'Simulation running' : 'Manual control'"></span>
                                </div>
                            </div>
                        </template>

                        <!-- Virtual Battery Card (when meter is an inverter) -->
                        <template x-if="$store.site.isMeterInverter() && $store.site.data?.virtual_devices?.length > 0">
                            <div class="member-card battery" x-data="virtualDeviceControls()">
                                <div class="member-header">
                                    <div class="member-info">
                                        <span class="member-serial">Battery</span>
                                        <span class="protocol-badge battery">virtual</span>
                                    </div>
                                </div>
                                <div class="member-power">
                                    <span class="power-label">Power</span>
                                    <span class="power-value" :class="getBatteryPowerClass()" x-text="formatBatteryPower()"></span>
                                </div>
                                <div class="member-controls">
                                    <div class="member-control-row">
                                        <span class="control-label">SoC</span>
                                        <div class="mini-progress">
                                            <div class="mini-progress-fill battery" :style="`width: ${batterySoc}%`"></div>
                                        </div>
                                        <span class="control-value" x-text="`${batterySoc.toFixed(0)}%`"></span>
                                    </div>
                                    <div class="member-control-row">
                                        <span class="control-label">Power</span>
                                        <div class="mini-slider-container">
                                            <input type="range" class="mini-slider battery-power"
                                                   min="-5000" max="5000" step="100"
                                                   :value="batteryPower"
                                                   :disabled="isSimulationRunning"
                                                   @input="onBatteryPowerInput($event.target.value)"
                                                   @change="onBatteryPowerChange($event.target.value)">
                                        </div>
                                        <span class="control-value" :class="getBatteryPowerClass()"
                                              x-text="`${(Math.abs(batteryPower) / 1000).toFixed(1)} kW`"></span>
                                    </div>
                                </div>
                                <div class="member-footer">
                                    <span class="status-indicator running"></span>
                                    <span class="status-text" x-text="isSimulationRunning ? 'Simulation running' : 'Manual control'"></span>
                                </div>
                            </div>
                        </template>

                        <template x-for="simId in ($store.site.data?.simulator_ids || [])" :key="simId">
                            <div class="member-card" :class="getSimInfo(simId).protocol">
                                <!-- Header with serial, protocol badge, and actions -->
                                <div class="member-header">
                                    <div class="member-info" @click="openSimulator(simId)" style="cursor: pointer;" title="Open full simulator view">
                                        <span class="member-serial" x-text="getSimInfo(simId).serial"></span>
                                        <span class="protocol-badge" :class="getSimInfo(simId).protocol"
                                              x-text="getSimInfo(simId).protocol"></span>
                                        <template x-if="simId === $store.site.data?.meter_id">
                                            <span class="meter-badge">meter</span>
                                        </template>
                                    </div>
                                    <div class="member-actions">
                                        <button class="member-open-btn" @click="openSimulator(simId)" title="Open full view">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                                <polyline points="15 3 21 3 21 9"/>
                                                <line x1="10" y1="14" x2="21" y2="3"/>
                                            </svg>
                                        </button>
                                        <button class="member-remove-btn" @click="removeDevice(simId)" title="Remove from site">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <!-- Power contribution -->
                                <div class="member-power">
                                    <span class="power-label">Contribution</span>
                                    <span class="power-value"

                                            <span class="control-status" x-text="getOcppEvConnected(simId) ? 'Connected' : 'Disconnected'"></span>

                                            <div class="mini-slider-container">

                            <template x-if="hasMeterInverter && batteryPower !== 0">

                    </template>

                    <!-- MQTT Controls -->
                    <template x-if="$store.app.selectedProtocol === 'mqtt'">
                        <div class="auto-row" x-data="mqttControls()">
                            <div class="controls-two-column">
                                <div class="controls-column-left">
                                    <div class="control-group">
                                        <span class="control-group-label">EV Connected</span>
                                        <div class="toggle-switch">
                                            <div class="toggle-switch-track"
                                                 :class="{ 'on': evConnected }"
                                                 @click="toggleEVConnected()">
                                                <div class="toggle-switch-thumb"></div>
                                            </div>
                                            <span class="toggle-switch-status"
                                                  :class="evConnected ? 'running' : 'stopped'"
                                                  x-text="evConnected ? 'Yes' : 'No'"></span>
                                        </div>
                                    </div>
                                    <div class="control-group">
                                        <span class="control-group-label">Awake</span>
                                        <div class="toggle-switch">
                                            <div class="toggle-switch-track"
                                                 :class="{ 'on': isAwake }"
                                                 @click="toggleWakeUp()">
                                                <div class="toggle-switch-thumb"></div>
                                            </div>
                                            <span class="toggle-switch-status"
                                                  :class="isAwake ? 'running' : 'stopped'"
                                                  x-text="isAwake ? 'Yes' : 'No'"></span>
                                        </div>
                                    </div>
                                    <div class="control-group">
                                        <span class="control-group-label">Mode</span>
                                        <select x-model="controlMode" @change="setControlMode()">
                                            <option value="CONTROLLABLE">Controllable</option>
                                            <option value="LIMITABLE">Limitable</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="controls-column-right">
                                    <div class="control-group vertical">
                                        <span class="control-group-label">Power Control</span>
                                        <div class="power-slider-container">
                                            <div class="power-slider-labels">
                                                <span x-text="`-${(maxDischarge / 1000).toFixed(0)} kW`"></span>
                                                <span>0</span>
                                                <span x-text="`${(maxCharge / 1000).toFixed(0)} kW`"></span>
                                            </div>
                                            <div class="power-slider-track">
                                                <div class="power-slider-center"></div>
                                                <input type="range" class="power-slider-input"
                                                       :min="-maxDischarge" :max="maxCharge"
                                                       :value="powerSliderValue" step="100"
                                                       @input="onPowerInput($event)"
                                                       @change="onPowerChange($event)">
                                            </div>
                                            <div :class="powerDisplayClass" x-text="powerDisplayValue"></div>
                                        </div>
                                    </div>
                                    <div class="control-group vertical">
                                        <span class="control-group-label">Battery State of Charge</span>
                                        <div class="soc-slider-container">
                                            <div class="soc-slider-labels">
                                                <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
                                            </div>
                                            <div class="soc-slider-track">
                                                <input type="range" class="soc-slider-input"
                                                       min="0" max="100" :value="socSliderValue" step="1"
                                                       @input="onSocInput($event)"
                                                       @change="onSocChange($event)">
                                            </div>
                                            <div :class="socDisplayClass" x-text="`${Math.round(socSliderValue)}%`"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- OCPP Controls -->
                    <template x-if="$store.app.selectedProtocol === 'ocpp'">
                        <div class="auto-row" x-data="ocppControls()">
                            <div class="controls-two-column">
                                <div class="controls-column-left">
                                    <div class="control-group">
                                        <span class="control-group-label">EV Connected</span>
                                        <div class="toggle-switch">
                                            <div class="toggle-switch-track"
                                                 :class="{ 'on': evConnected }"
                                                 @click="toggleEVConnected()">
                                                <div class="toggle-switch-thumb"></div>
                                            </div>
                                            <span class="toggle-switch-status"
                                                  :class="evConnected ? 'running' : 'stopped'"
                                                  x-text="evConnected ? 'Yes' : 'No'"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="controls-column-right">
                                    <div class="control-group vertical">
                                        <span class="control-group-label">Charging Power (drag to start charging)</span>
                                        <div class="power-slider-container">
                                            <div class="power-slider-labels">
                                                <span>0 (off)</span>
                                                <span x-text="maxPowerLabel"></span>
                                            </div>
                                            <div class="power-slider-track" style="background: linear-gradient(to right, rgba(100, 100, 100, 0.3) 0%, rgba(0, 200, 100, 0.3) 100%);">
                                                <input type="range" class="power-slider-input"
                                                       min="0" :max="maxPower"
                                                       :value="powerSliderValue" step="100"
                                                       :disabled="!evConnected"
                                                       @input="onPowerInput($event)"
                                                       @change="onPowerChange($event)">
                                            </div>
                                            <div :class="powerDisplayClass" x-text="powerDisplayValue"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- State Section (MQTT/OCPP) -->
                <template x-if="$store.app.selectedProtocol !== 'modbus'">
                    <div class="section" x-data="$store.app.selectedProtocol === 'mqtt' ? mqttState() : ocppState()">
                        <div class="section-title" x-text="$store.app.selectedProtocol === 'mqtt' ? 'V2X Charger State' : 'OCPP Charger State'"></div>
                        <div class="state-grid">
                            <template x-for="card in stateCards" :key="card.label">
                                <div class="state-card" :class="{ 'highlight': card.highlight }">
                                    <div class="state-label" x-text="card.label"></div>
                                    <div class="state-value"
                                         :class="card.colorClass || ''"
                                         :style="card.colorStyle || ''"
                                         x-text="card.value"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Connectors Section (OCPP) -->
                <template x-if="$store.app.selectedProtocol === 'ocpp'">
                    <div class="section" x-data="ocppState()">
                        <div class="section-title">Connectors</div>
                        <div class="connector-grid">
                            <template x-for="conn in connectors" :key="conn.id">
                                <div class="connector-card">
                                    <div class="connector-header">
                                        <span class="connector-id" x-text="`Connector ${conn.id}`"></span>
                                        <span class="connector-status"
                                              :class="conn.status?.toLowerCase()"
                                              x-text="conn.status"></span>
                                    </div>
                                    <div class="connector-details">
                                        <span x-text="`Power: ${(conn.currentPower || 0).toFixed(0)} W`"></span><br>
                                        <span x-text="`Energy: ${(conn.energyWh || 0).toFixed(0)} Wh`"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Debug Section (OCPP) -->
                <template x-if="$store.app.selectedProtocol === 'ocpp'">
                    <div class="section" x-data="ocppDebug()">
                        <div class="section-title" style="display: flex; align-items: center; gap: 0.5rem;">
                            <span>MeterValues Debug</span>
                            <button class="btn btn-action" style="padding: 0.2rem 0.5rem; font-size: 0.7rem;" @click="refresh()">Refresh</button>
                        </div>
                        <div class="debug-panel">
                            <div class="debug-grid">
                                <div class="debug-card">
                                    <div class="debug-card-title">3-Phase Voltages</div>
                                    <div class="debug-values">
                                        <div class="debug-value-row"><span>L1:</span> <span x-text="formatVoltage('voltage_L1')"></span> V</div>
                                        <div class="debug-value-row"><span>L2:</span> <span x-text="formatVoltage('voltage_L2')"></span> V</div>
                                        <div class="debug-value-row"><span>L3:</span> <span x-text="formatVoltage('voltage_L3')"></span> V</div>
                                    </div>
                                </div>
                                <div class="debug-card">
                                    <div class="debug-card-title">3-Phase Currents</div>
                                    <div class="debug-values">
                                        <div class="debug-value-row"><span>L1:</span> <span x-text="formatCurrent('current_L1')"></span> A</div>
                                        <div class="debug-value-row"><span>L2:</span> <span x-text="formatCurrent('current_L2')"></span> A</div>
                                        <div class="debug-value-row"><span>L3:</span> <span x-text="formatCurrent('current_L3')"></span> A</div>
                                    </div>
                                </div>
                                <div class="debug-card">
                                    <div class="debug-card-title">Power & Energy</div>
                                    <div class="debug-values">
                                        <div class="debug-value-row"><span>Power:</span> <span x-text="formatPower()"></span> W</div>
                                        <div class="debug-value-row"><span>Energy:</span> <span x-text="formatEnergy()"></span> Wh</div>
                                    </div>
                                </div>
                            </div>
                            <div class="debug-json-section">
                                <div class="debug-card-title" style="margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                                    Sample MeterValues JSON
                                    <button class="copy-btn" :class="{ 'copied': copySuccess }" @click="copyJson()" title="Copy JSON to clipboard">
                                        <svg x-show="!copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                        </svg>
                                        <svg x-show="copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="20 6 9 17 4 12"></polyline>
                                        </svg>
                                    </button>
                                </div>
                                <pre class="debug-json" x-text="sampleJson"></pre>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Tabbed View Section (Modbus Inverters) -->
                <template x-if="$store.app.selectedProtocol === 'modbus'">
                    <div class="section" x-data="inverterDefaultTab()">
                        <!-- Tab Bar -->
                        <div class="simulator-view-tabs">
                            <button class="view-tab" :class="{ 'active': activeTab === 'default' }"
                                    @click="activeTab = 'default'">Default</button>
                            <button class="view-tab" :class="{ 'active': activeTab === 'registers' }"
                                    @click="activeTab = 'registers'">Registers</button>
                        </div>

                        <!-- Default Tab Content -->
                        <div x-show="activeTab === 'default'" class="default-tab-content">
                            <!-- Energy Meter Section -->
                            <div class="default-section">
                                <div class="default-section-title">Energy Meter</div>
                                <div class="meter-mini-display">
                                    <div class="meter-mini-power">
                                        <div class="meter-mini-label" x-text="meterPower >= 0 ? 'IMPORTING' : 'EXPORTING'"></div>
                                        <div class="meter-mini-value" :class="{ 'exporting': meterPower < 0 }">
                                            <span class="meter-mini-number" x-text="Math.abs(meterPower).toFixed(0)"></span>
                                            <span class="meter-mini-unit">W</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Battery Section -->
                            <div class="default-section">
                                <div class="default-section-title">Battery</div>
                                <div class="battery-container">
                                    <div class="battery-visual">
                                        <div class="battery-cap"></div>
                                        <div class="battery-body">
                                            <div class="battery-fill" :style="getBatteryFillStyle()"></div>
                                            <div class="battery-percentage" x-text="`${Math.round(batterySoc)}%`"></div>
                                        </div>
                                    </div>
                                    <div class="battery-controls">
                                        <div class="control-row">
                                            <span class="control-label">State of Charge</span>
                                            <div class="slider-container">
                                                <input type="range" class="default-slider soc-slider"
                                                       min="0" max="100" step="0.1"
                                                       :value="batterySoc"
                                                       :disabled="isSimulationRunning"
                                                       @mousedown="onSliderMouseDown('soc')"
                                                       @input="onSocInput($event.target.value)"
                                                       @change="onSocChange($event.target.value)">
                                            </div>
                                            <span class="control-value" x-text="`${batterySoc.toFixed(1)}%`"></span>
                                        </div>
                                        <div class="control-row">
                                            <span class="control-label">Power</span>
                                            <div class="slider-container">
                                                <input type="range" class="default-slider power-slider"
                                                       :min="-maxBatteryPower" :max="maxBatteryPower" step="100"
                                                       :value="batteryPower"
                                                       :disabled="isSimulationRunning"
                                                       @mousedown="onSliderMouseDown('batteryPower')"
                                                       @input="onBatteryPowerInput($event.target.value)"
                                                       @change="onBatteryPowerChange($event.target.value)">
                                            </div>
                                            <span class="control-value" :class="getBatteryPowerClass()"
                                                  x-text="formatBatteryPower()"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Solar PV Section -->
                            <div class="default-section">
                                <div class="default-section-title">Solar PV</div>
                                <div class="pv-container">
                                    <div class="sun-icon" :style="getSunGlowStyle()">
                                        <svg viewBox="0 0 100 100" width="80" height="80">
                                            <circle cx="50" cy="50" r="20" fill="#FFD700"/>
                                            <g stroke="#FFD700" stroke-width="3" stroke-linecap="round">
                                                <line x1="50" y1="10" x2="50" y2="22"/>
                                                <line x1="50" y1="78" x2="50" y2="90"/>
                                                <line x1="10" y1="50" x2="22" y2="50"/>
                                                <line x1="78" y1="50" x2="90" y2="50"/>
                                                <line x1="21.7" y1="21.7" x2="30.2" y2="30.2"/>
                                                <line x1="69.8" y1="69.8" x2="78.3" y2="78.3"/>
                                                <line x1="21.7" y1="78.3" x2="30.2" y2="69.8"/>
                                                <line x1="69.8" y1="30.2" x2="78.3" y2="21.7"/>
                                            </g>
                                        </svg>
                                    </div>
                                    <div class="pv-controls">
                                        <div class="control-row">
                                            <span class="control-label">Power Output</span>
                                            <div class="slider-container">
                                                <input type="range" class="default-slider pv-slider"
                                                       min="0" :max="maxPvPower" step="100"
                                                       :value="pvPower"
                                                       :disabled="isSimulationRunning"
                                                       @mousedown="onSliderMouseDown('pv')"
                                                       @input="onPvPowerInput($event.target.value)"
                                                       @change="onPvPowerChange($event.target.value)">
                                            </div>
                                            <span class="control-value pv-power" x-text="`${pvPower.toFixed(0)} W`"></span>
                                        </div>
                                        <div class="pv-power-display">
                                            <span class="pv-power-value" x-text="`${(pvPower / 1000).toFixed(2)} kW`"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Reset Button -->
                            <div class="default-actions">
                                <button class="reset-btn" @click="resetToDefaults()"
                                        :disabled="isSimulationRunning">
                                    Reset to Defaults
                                </button>
                            </div>
                        </div>

                        <!-- Registers Tab Content -->
                        <div x-show="activeTab === 'registers'" x-data="modbusRegisters()">
                            <div class="register-grid">
                                <template x-for="reg in $store.simulator.registers" :key="reg.address">
                                    <div class="register-card">
                                        <div class="register-header">
                                            <span class="register-name" x-text="reg.name"></span>
                                            <span class="register-addr" x-text="reg.address"></span>
                                        </div>
                                        <div class="register-value">
                                            <span x-text="formatValue(reg)"></span>
                                            <span class="register-unit" x-text="reg.unit || ''"></span>
                                        </div>
                                        <div class="register-input">
                                            <input type="number" placeholder="Set" step="any"
                                                   @input="setInputValue(reg.address, $event.target.value)">
                                            <button @click="writeRegister(reg.address)">Set</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Simulation Mode Warning Dialog -->
                        <div class="sim-warning-dialog-backdrop" x-show="showSimModeDialog" @click="cancelDialog()"></div>
                        <div class="sim-warning-dialog" x-show="showSimModeDialog">
                            <div class="sim-warning-title">Simulation Running</div>
                            <div class="sim-warning-message">
                                The simulation is currently running. To manually adjust values, you need to turn off the simulation first.
                            </div>
                            <div class="sim-warning-actions">
                                <button class="btn btn-primary" @click="stopSimAndApply()">Turn Off Simulation</button>
                                <button class="btn btn-secondary" @click="cancelDialog()">Cancel</button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Logs Section -->
                <div class="section" x-data="logsViewer()">
                    <div class="section-title" style="display: flex; align-items: center; justify-content: space-between;">
                        <span x-text="$store.app.selectedProtocol === 'modbus' ? 'Modbus Log' : ($store.app.selectedProtocol === 'mqtt' ? 'MQTT Log' : 'OCPP Log')"></span>
                        <button class="copy-btn" :class="{ 'copied': copySuccess }" @click="copyLogs()" title="Copy logs to clipboard">
                            <svg x-show="!copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <svg x-show="copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="log-container" :class="{ 'ocpp-log': $store.app.selectedProtocol === 'ocpp' }">
                        <template x-if="$store.simulator.logs.length === 0">
                            <div class="log-empty">No activity yet</div>
                        </template>
                        <template x-for="log in $store.simulator.logs" :key="log.timestamp + log.operation">
                            <div class="log-entry">
                                <span class="log-time" x-text="formatTime(log.timestamp)"></span>
                                <span :class="getOpClass(log)" x-text="log.operation"></span>
                                <template x-if="log.address !== undefined">
                                    <span class="log-addr" x-text="log.address"></span>
                                </template>
                                <span class="log-values" x-text="formatDetails(log)"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- MQTT Clients Section -->
                <template x-if="$store.app.selectedProtocol === 'mqtt'">
                    <div class="section" x-data="mqttClients()" x-init="$store.simulator.loadClients()">
                        <div class="section-title">Connected Clients <span style="color: var(--text-muted); font-weight: normal;" x-text="`(${count})`"></span></div>
                        <div class="clients-container">
                            <template x-if="clients.length === 0">
                                <div class="log-empty">No clients connected</div>
                            </template>
                            <template x-for="client in clients" :key="client.id">
                                <div class="client-box">
                                    <div class="client-id" x-text="client.id"></div>
                                    <div class="client-detail">
                                        <span class="label">Address</span>
                                        <span class="value" x-text="client.remote_addr"></span>
                                    </div>
                                    <div class="client-detail">
                                        <span class="label">Subscriptions</span>
                                        <span class="value" x-text="client.subscription_count"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        </div><!-- /main-content -->
    </main>

</body>
</html>

                        <button class="add-device-option" @click="$store.app.addSimulatorToSite('inverter')">
                            <div class="add-device-option-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
                                    <path d="M12.667 8 10 12h4l-2.667 4" />
                                </svg>
                            </div>
                            <div class="add-device-option-name">Inverter</div>
                            <span class="protocol-badge modbus">modbus</span>
                            <div class="add-device-option-desc">Solar/hybrid inverter with PV, battery, and grid registers</div>
                        </button>
                        <button class="add-device-option" @click="$store.app.addSimulatorToSite('energy_meter')">
                            <div class="add-device-option-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m12 14 4-4" />
                                    <path d="M3.34 19a10 10 0 1 1 17.32 0" />
                                </svg>
                            </div>
                            <div class="add-device-option-name">Energy Meter</div>
                            <span class="protocol-badge modbus">modbus</span>
                            <div class="add-device-option-desc">3-phase energy meter with per-phase power and totals</div>
                        </button>
                        <button class="add-device-option" @click="$store.app.addSimulatorToSite('v2x_charger')">
                            <div class="add-device-option-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0v-6.998a2 2 0 0 0-.59-1.42L18 5" />
                                    <path d="M14 21V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v16" />
                                    <path d="M2 21h13" />
                                    <path d="M3 7h11" />
                                    <path d="m9 11-2 3h3l-2 3" />
                                </svg>
                            </div>
                            <div class="add-device-option-name">V2X Charger</div>
                            <span class="protocol-badge mqtt">mqtt</span>
                            <div class="add-device-option-desc">Bi-directional EV charger with MQTT control interface</div>
                        </button>
                        <button class="add-device-option" @click="$store.app.addSimulatorToSite('ocpp_charger')">
                            <div class="add-device-option-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0v-6.998a2 2 0 0 0-.59-1.42L18 5" />
                                    <path d="M14 21V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v16" />
                                    <path d="M2 21h13" />
                                    <path d="M3 7h11" />
                                    <path d="m9 11-2 3h3l-2 3" />
                                </svg>
                            </div>
                            <div class="add-device-option-name">OCPP Charger</div>
                            <span class="protocol-badge ocpp">ocpp</span>
                            <div class="add-device-option-desc">OCPP 1.6J charge point with remote start/stop</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Confirmation Modal -->
    <template x-if="$store.confirm.show">
        <div class="confirm-modal" x-data="confirmModal()"
             style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;">
            <div style="background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 1.5rem; min-width: 300px; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
                <h3 style="margin: 0 0 0.5rem 0; color: var(--text-primary);" x-text="$store.confirm.title"></h3>
                <p style="margin: 0 0 1.5rem 0; color: var(--text-secondary);" x-text="$store.confirm.message"></p>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button @click="$store.confirm.cancel()"
                            x-show="$store.confirm.showCancel"
                            class="btn btn-secondary"
                            x-text="$store.confirm.cancelLabel">
                    </button>
                    <button @click="$store.confirm.ok()"
                            class="btn"
                            :class="$store.confirm.okVariant === 'danger' ? 'btn-danger' : 'btn-primary'"
                            x-text="$store.confirm.okLabel">
                    </button>
                </div>
            </div>
        </div>
    </template>

</body>
</html>

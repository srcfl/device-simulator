                        <!-- Non-inverter devices (inverters shown as PV/Battery cards above) -->
                        <template x-for="sim in getNonInverterSimulators()" :key="sim.id">
                            <div class="member-card" :class="sim.protocol + (!sim.running ? ' offline' : '')">
                                <!-- Header with serial, protocol badge, and actions -->
                                <div class="member-header">
                                    <div class="member-info" @click="openSimulator(sim.id)" style="cursor: pointer;" title="Open full simulator view">
                                        <span class="member-serial" x-text="sim.serial"></span>
                                        <span class="protocol-badge" :class="sim.protocol"
                                              x-text="sim.protocol"></span>
                                        <template x-if="sim.id === $store.site.data?.meter_id">
                                            <span class="meter-badge">meter</span>
                                        </template>
                                    </div>
                                    <div class="member-actions">
                                        <div class="mini-toggle emu-toggle" :class="{ 'on': sim.running, 'loading': isToggleLocked('emu-' + sim.id) }"
                                             @click="toggleEmulator(sim.id)" title="Toggle emulation">
                                            <div class="mini-toggle-thumb"></div>
                                        </div>
                                        <button class="member-open-btn" @click="openSimulator(sim.id)" title="Open full view">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                                <polyline points="15 3 21 3 21 9"/>
                                                <line x1="10" y1="14" x2="21" y2="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <!-- Power contribution -->
                                <div class="member-power">
                                    <span class="power-label">Contribution</span>
                                    <span class="power-value"
                                          :style="getPowerContribution(sim.id) >= 0 ? 'color: var(--color-warning);' : 'color: var(--color-primary);'"
                                          x-text="formatPowerContribution(sim.id)"></span>
                                </div>

                                <!-- Protocol-specific controls -->

                                <!-- MQTT Controls -->
                                <template x-if="sim.protocol === 'mqtt'">
                                    <div class="member-controls">
                                        <div class="member-control-row">
                                            <span class="control-label">EV</span>
                                            <div class="mini-toggle" :class="{ 'on': getMqttEvConnected(sim.id), 'disabled': !sim.running }"
                                                 @click="if (!sim.running) return; toggleMqttEvConnected(sim.id)">
                                                <div class="mini-toggle-thumb"></div>
                                            </div>
                                            <span class="control-status" x-text="getMqttEvConnected(sim.id) ? 'Connected' : 'Disconnected'"></span>
                                        </div>
                                        <div class="member-control-row">
                                            <span class="control-label">Power</span>
                                            <div class="mini-slider-container">
                                                <input type="range" class="mini-slider mqtt-power"
                                                       :min="-getMqttMaxDischarge(sim.id)" :max="getMqttMaxCharge(sim.id)"
                                                       :value="getMqttPower(sim.id)" step="500"
                                                       :disabled="!sim.running"
                                                       :class="{ 'disabled': !sim.running }"
                                                       @change="setMqttPower(sim.id, parseInt($event.target.value))">
                                            </div>
                                            <span class="control-value" :style="getPowerColorStyle(getMqttPower(sim.id), 'mqtt')"
                                                  x-text="formatMqttPower(getMqttPower(sim.id))"></span>
                                        </div>
                                        <div class="member-control-row">
                                            <span class="control-label">SoC</span>
                                            <div class="mini-progress">
                                                <div class="mini-progress-fill" :style="`width: ${getMqttSoc(sim.id)}%`"></div>
                                            </div>
                                            <span class="control-value" x-text="`${getMqttSoc(sim.id).toFixed(0)}%`"></span>
                                        </div>
                                    </div>
                                </template>

                                <!-- OCPP Controls -->
                                <template x-if="sim.protocol === 'ocpp'">
                                    <div class="member-controls">
                                        <div class="member-control-row">
                                            <span class="control-label">EV</span>
                                            <div class="mini-toggle" :class="{ 'on': getOcppEvConnected(sim.id), 'disabled': !sim.running }"
                                                 @click="if (!sim.running) return; toggleOcppEvConnected(sim.id)">
                                                <div class="mini-toggle-thumb"></div>
                                            </div>
                                            <span class="control-status" x-text="getOcppEvConnected(sim.id) ? 'Connected' : 'Disconnected'"></span>
                                        </div>
                                        <div class="member-control-row">
                                            <span class="control-label">Charge</span>
                                            <div class="mini-slider-container">
                                                <input type="range" class="mini-slider ocpp-power"
                                                       min="0" :max="getOcppMaxPower(sim.id)"
                                                       :value="getOcppPower(sim.id)" step="500"
                                                       :disabled="!sim.running || !getOcppEvConnected(sim.id)"
                                                       :class="{ 'disabled': !sim.running }"
                                                       @change="setOcppPower(sim.id, parseInt($event.target.value))">
                                            </div>
                                            <span class="control-value" :style="getPowerColorStyle(getOcppPower(sim.id), 'ocpp')"
                                                  x-text="formatOcppPower(getOcppPower(sim.id))"></span>
                                        </div>
                                    </div>
                                </template>

                                <!-- Modbus Controls -->
                                <template x-if="sim.protocol === 'modbus'">
                                    <div class="member-controls">
                                        <div class="member-control-row">
                                            <span class="control-label">PV</span>
                                            <span class="control-value" style="color: var(--color-primary);"
                                                  x-text="`${(sim.pv_power || 0).toFixed(0)} W`"></span>
                                        </div>
                                        <div class="member-control-row">
                                            <span class="control-label">SoC</span>
                                            <div class="mini-progress">
                                                <div class="mini-progress-fill" :style="`width: ${sim.soc || 0}%`"></div>
                                            </div>
                                            <span class="control-value" x-text="`${(sim.soc || 0).toFixed(0)}%`"></span>
                                        </div>
                                    </div>
                                </template>

                                <!-- Status footer -->
                                <div class="member-footer">
                                    <span class="status-indicator" :class="{ 'running': sim.running }"></span>
                                    <span class="status-text" x-text="sim.running ? 'Running' : 'Stopped'"></span>
                                    <button x-show="!sim.running" class="member-delete-btn"
                                            @click="$store.app.deleteSimulator(sim.id, sim.serial)"
                                            title="Delete simulator">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- Add Device skeleton card -->
                        <div class="member-card add-device-card" @click="$store.app.openAddDeviceModal()">
                            <div class="add-device-content">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"/>
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                                <span>Add Device</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Live Power Balance Formula -->
                <div class="section" x-data="liveFormula()">
                    <div class="formula-display">
                        <div class="formula-equation">
                            <span class="formula-label">Meter</span>
                            <span class="formula-equals">=</span>
                            <span class="formula-term">
                                <span class="formula-term-label">Σ All Power</span>
                                <span class="formula-term-value"
                                      :class="meterPower >= 0 ? 'positive' : 'negative'"
                                      x-text="formatValue(meterPower)"></span>
                            </span>
                            <span class="formula-equals">=</span>
                            <span class="formula-result"
                                  :class="meterPower >= 0 ? 'importing' : 'exporting'"
                                  x-text="meterPower >= 0 ? 'IMPORTING' : 'EXPORTING'"></span>
                        </div>
                        <div class="formula-breakdown">
                            <span class="formula-contrib" x-show="baseLoad > 0">
                                <span class="formula-contrib-name">Home Load</span>
                                <span class="formula-contrib-value positive" x-text="formatValue(baseLoad)"></span>
                            </span>
                            <template x-if="hasMeterInverter && pvPower !== 0">
                                <span class="formula-contrib">
                                    <span class="formula-contrib-name">Solar PV</span>
                                    <span class="formula-contrib-value negative" x-text="formatValue(-pvPower)"></span>
                                </span>
                            </template>
                            <template x-if="hasMeterInverter && batteryPower !== 0">
                                <span class="formula-contrib">
                                    <span class="formula-contrib-name">Battery</span>
                                    <span class="formula-contrib-value"
                                          :class="batteryPower >= 0 ? 'positive' : 'negative'"
                                          x-text="formatValue(batteryPower)"></span>
                                </span>
                            </template>
                            <template x-for="contrib in contributions" :key="contrib.id">
                                <span class="formula-contrib">
                                    <span class="formula-contrib-name" x-text="contrib.name"></span>
                                    <span class="formula-contrib-value"
                                          :class="contrib.power >= 0 ? 'positive' : 'negative'"
                                          x-text="formatValue(contrib.power)"></span>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Energy Meter View (specialized) -->
        <template x-if="$store.app.selectedId && $store.simulator.data?.category === 'energy_meter'">
            <div x-data="energyMeterView()">
                <!-- Config Section -->
                <div class="section">
                    <div class="config-row" x-data="configRow()">
                        <div class="config-item">
                            <label>Serial (U32)</label>
                            <template x-if="!$store.simulator.data?.running">
                                <input type="number"
                                       min="0"
                                       max="4294967295"
                                       x-model="localSerial"
                                       @focus="onSerialFocus()"
                                       @blur="onMeterSerialBlur()"
                                       @input="validateMeterSerial($event)"
                                       placeholder="0-4294967295">
                            </template>
                            <template x-if="$store.simulator.data?.running">
                                <div class="value live" x-text="getRuntimeSerial()"></div>
                            </template>
                        </div>
                        <div class="config-item">
                            <label>Unit ID</label>
                            <template x-if="!$store.simulator.data?.running">
                                <input type="number" min="1" max="247"
                                       x-model.number="localSlaveId"
                                       @focus="onSlaveIdFocus()"
                                       @blur="onSlaveIdBlur()">
                            </template>
                            <template x-if="$store.simulator.data?.running">
                                <div class="value live" x-text="getRuntimeSlaveId()"></div>
                            </template>
                        </div>
                        <div class="config-item">
                            <label>Profile</label>
                            <template x-if="!$store.simulator.data?.running">
                                <select x-model="localProfile" @change="onProfileChange($event.target.value)">
                                    <template x-for="profile in $store.simulator.profiles" :key="profile.name">
                                        <option :value="profile.name" x-text="profile.name + (profile.zap_verified ? ' ⚡' : '')"></option>
                                    </template>
                                </select>
                            </template>
                            <template x-if="$store.simulator.data?.running">
                                <div class="value live" x-text="localProfile"></div>
                            </template>
                        </div>
                        <div class="config-item">
                            <label>Modbus Port</label>
                            <template x-if="$store.simulator.data?.running && $store.simulator.data?.port">
                                <div class="value" x-text="($store.simulator.data?.port || 0) + $store.app.modbusDisplayOffset"></div>
                            </template>
                            <template x-if="!$store.simulator.data?.running && $store.simulator.data?.port">
                                <div class="value" style="color: var(--text-muted);" x-text="`Last: ${($store.simulator.data?.port || 0) + $store.app.modbusDisplayOffset}`"></div>
                            </template>
                            <template x-if="!$store.simulator.data?.port">
                                <div class="value" style="color: var(--text-muted);">Not allocated</div>
                            </template>
                        </div>
                        <div class="config-item">
                            <label>Site</label>
                            <div class="value" x-text="getSiteName() || 'Not assigned'"></div>
                        </div>
                        <div class="config-item" style="margin-left: auto;">
                            <label x-text="$store.simulator.data?.mdns_hostname ? 'Hostname' : 'Host IP'">Host IP</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <span class="host-ip" x-text="$store.simulator.data?.mdns_hostname ? $store.simulator.data.mdns_hostname + '.local' : $store.app.localIP"></span>
                                <button class="copy-btn" @click="navigator.clipboard.writeText($store.simulator.data?.mdns_hostname ? $store.simulator.data.mdns_hostname + '.local' : $store.app.localIP)" title="Copy">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="config-item">
                            <label>Emulator</label>
                            <div class="toggle-switch" style="height: 32px;">
                                <div class="toggle-switch-track"
                                     :class="{ 'on': $store.simulator.data?.running, 'loading': $store.simulator.emulatorToggling }"
                                     @click="$store.simulator.toggleEmulator()">
                                    <div class="toggle-switch-thumb"></div>
                                </div>
                                <span class="toggle-switch-status"
                                      :class="$store.simulator.emulatorToggling ? 'toggling' : ($store.simulator.data?.running ? 'running' : 'stopped')"
                                      x-text="$store.simulator.emulatorToggling ? ($store.simulator.data?.running ? 'Stopping\u2026' : 'Starting\u2026') : ($store.simulator.data?.running ? 'Online' : 'Offline')"></span>
                            </div>
                        </div>
                    </div>
                    <div class="config-row" x-show="selectedSiteId" style="margin-top: 4px;">
                        <div class="config-item">
                            <label>P1 Update</label>
                            <div class="p1-mode-toggle">
                                <button class="p1-mode-btn"
                                        :class="{ 'active': p1Mode === 'direct' }"
                                        @click="setP1Mode('direct')">Direct</button>
                                <button class="p1-mode-btn"
                                        :class="{ 'active': p1Mode === '1s' }"
                                        @click="setP1Mode('1s')">1s</button>
                                <button class="p1-mode-btn"
                                        :class="{ 'active': p1Mode === '10s' }"
                                        @click="setP1Mode('10s')">10s</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Meter Display -->
                <div class="section">
                    <div class="meter-display">
                        <div class="meter-display-header">
                            <span class="meter-model" x-text="$store.simulator.activeProfile || 'Energy Meter'"></span>
                            <span class="meter-status" :class="{ 'online': $store.simulator.data?.running }">
                                <span class="status-dot"></span>
                                <span x-text="$store.simulator.data?.running ? 'ONLINE' : 'OFFLINE'"></span>
                            </span>
                        </div>
                        <div class="meter-display-main">
                            <div class="meter-power-display">
                                <div class="meter-power-label" x-text="meterPower >= 0 ? 'IMPORTING' : 'EXPORTING'"></div>
                                <div class="meter-power-value" :class="{ 'exporting': meterPower < 0 }">
                                    <span class="meter-power-number" x-text="formatPowerDisplay(Math.abs(meterPower))"></span>
                                    <span class="meter-power-unit">W</span>
                                </div>
                                <div class="meter-power-kw" x-text="`${(Math.abs(meterPower) / 1000).toFixed(2)} kW`"></div>
                            </div>
                        </div>
                        <div class="meter-display-energy">
                            <div class="meter-energy-item">
                                <div class="meter-energy-icon import">↓</div>
                                <div class="meter-energy-data">
                                    <div class="meter-energy-label">Total Import</div>
                                    <div class="meter-energy-value" x-text="formatEnergy(importEnergy)"></div>
                                </div>
                            </div>
                            <div class="meter-energy-item">
                                <div class="meter-energy-icon export">↑</div>
                                <div class="meter-energy-data">
                                    <div class="meter-energy-label">Total Export</div>
                                    <div class="meter-energy-value" x-text="formatEnergy(exportEnergy)"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modbus Log -->
                <div class="section" x-data="logsViewer()">
                    <div class="section-title" style="display: flex; align-items: center; justify-content: space-between;">
                        <span>Modbus Log</span>
                        <button class="copy-btn" :class="{ 'copied': copySuccess }" @click="copyLogs()" title="Copy logs">
                            <svg x-show="!copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <svg x-show="copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="log-container">
                        <template x-if="$store.simulator.logs.length === 0">
                            <div class="log-empty">No activity yet</div>
                        </template>
                        <template x-for="log in $store.simulator.logs" :key="log.timestamp + log.operation">
                            <div class="log-entry">
                                <span class="log-time" x-text="formatTime(log.timestamp)"></span>

                                    <span class="log-addr" x-text="log.address"></span>
                                </template>
                                <span class="log-values" x-text="formatDetails(log)"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Connected Clients -->
                <div class="section" x-data="modbusClients()" x-init="$store.simulator.loadClients()">

                                <div class="client-id" x-text="client.remote_addr"></div>

                                <div class="client-detail">
                                    <span class="label">Last seen</span>
                                    <span class="value" x-text="formatTime(client.last_seen)"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Simulator View (regular, non-energy-meter) -->
        <template x-if="$store.app.selectedId && $store.simulator.data?.category !== 'energy_meter'">
            <div>
                <!-- Config Section -->

                    <div class="config-row" x-data="configRow()">

                            <label>Serial</label>
                            <template x-if="!$store.simulator.data?.running">
                                <input type="text"
                                       x-model="localSerial"
                                       @focus="onSerialFocus()"
                                       @blur="onSerialBlur()">
                            </template>
                            <template x-if="$store.simulator.data?.running">
                                <div class="value live" x-text="getRuntimeSerial()"></div>
                            </template>
                        </div>

                        <template x-if="$store.app.selectedProtocol === 'modbus'">
                            <div class="config-item">
                                <label>Unit ID</label>
                                <template x-if="!$store.simulator.data?.running">
                                    <input type="number" min="1" max="247"
                                           x-model.number="localSlaveId"
                                           @focus="onSlaveIdFocus()"
                                           @blur="onSlaveIdBlur()">
                                </template>
                                <template x-if="$store.simulator.data?.running">
                                    <div class="value live" x-text="getRuntimeSlaveId()"></div>
                                </template>
                            </div>
                        </template>
                        <template x-if="$store.app.selectedProtocol === 'modbus'">
                            <div class="config-item">
                                <label>Modbus Port</label>
                                <template x-if="$store.simulator.data?.running && $store.simulator.data?.port">
                                    <div class="value" x-text="($store.simulator.data?.port || 0) + $store.app.modbusDisplayOffset"></div>

                                <template x-if="!$store.simulator.data?.running && $store.simulator.data?.port">
                                    <div class="value" style="color: var(--text-muted);" x-text="`Last: ${($store.simulator.data?.port || 0) + $store.app.modbusDisplayOffset}`"></div>
                                </template>
                                <template x-if="!$store.simulator.data?.port">

                                </template>
                            </div>
                        </template>

                        <!-- MQTT: Port -->
                        <template x-if="$store.app.selectedProtocol === 'mqtt'">
                            <div class="config-item">
                                <label>MQTT Port</label>
                                <template x-if="$store.simulator.data?.running && $store.simulator.data?.port">
                                    <div class="value" x-text="($store.simulator.data?.port || 0) + $store.app.mqttDisplayOffset"></div>
                                </template>
                                <template x-if="!$store.simulator.data?.running && $store.simulator.data?.port">
                                    <div class="value" style="color: var(--text-muted);" x-text="`Last: ${($store.simulator.data?.port || 0) + $store.app.mqttDisplayOffset}`"></div>
                                </template>
                                <template x-if="!$store.simulator.data?.port">
                                    <div class="value" style="color: var(--text-muted);">Not allocated</div>
                                </template>
                            </div>
                        </template>

                        <template x-if="$store.app.selectedProtocol === 'ocpp'">
                            <div class="config-item">
                                <label>OCPP Port</label>
                                <template x-if="$store.simulator.data?.running && $store.simulator.data?.port">
                                    <div class="value" x-text="($store.simulator.data?.port || 0) + $store.app.ocppDisplayOffset"></div>
                                </template>
                                <template x-if="!$store.simulator.data?.running && $store.simulator.data?.port">
                                    <div class="value" style="color: var(--text-muted);" x-text="`Last: ${($store.simulator.data?.port || 0) + $store.app.ocppDisplayOffset}`"></div>
                                </template>
                                <template x-if="!$store.simulator.data?.port">
                                    <div class="value" style="color: var(--text-muted);">Not allocated</div>
                                </template>
                            </div>
                        </template>

                        <!-- OCPP: URL - editable when offline -->
                        <template x-if="$store.app.selectedProtocol === 'ocpp'">
                            <div class="config-item" style="flex: 2;">
                                <label>OCPP URL</label>
                                <template x-if="!$store.simulator.data?.running">
                                    <input type="text" placeholder="ws://host:port/path"
                                           x-model="localOcppUrl"
                                           @focus="onOcppUrlFocus()"
                                           @input="onOcppUrlInput()"
                                           @blur="onOcppUrlBlur()"
                                           style="flex: 1; padding: 6px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary);">
                                </template>
                                <template x-if="$store.simulator.data?.running">
                                    <div class="value live" style="flex: 1; word-break: break-all;" x-text="getRuntimeOcppUrl() || '(not set)'"></div>
                                </template>
                            </div>
                        </template>
                        <template x-if="$store.app.selectedProtocol === 'ocpp'">
                            <div class="config-item">
                                <label>Connection</label>
                                <div class="value"
                                     :style="$store.simulator.data?.state?.connected ? 'color: var(--color-primary);' : 'color: var(--text-muted);'"
                                     x-text="$store.simulator.data?.state?.connected ? 'Connected' : 'Disconnected'"></div>
                            </div>
                        </template>

                        <!-- Profile Selector - editable when offline -->
                        <div class="config-item">
                            <label>Profile</label>
                            <template x-if="!$store.simulator.data?.running">
                                <select x-model="localProfile" @change="onProfileChange($event.target.value)">
                                    <template x-for="profile in $store.simulator.profiles" :key="profile.name">
                                        <option :value="profile.name" x-text="profile.name + (profile.zap_verified ? ' ⚡' : '')"></option>
                                    </template>
                                </select>
                            </template>
                            <template x-if="$store.simulator.data?.running">
                                <div class="value live" x-text="localProfile"></div>
                            </template>
                        </div>

                        <!-- Connected Site (for inverters only) -->
                        <template x-if="$store.app.selectedProtocol === 'modbus' && $store.simulator.data?.category === 'inverter'">
                            <div class="config-item" x-data="inverterView()">
                                <label>Site</label>
                                <div class="value" x-text="getSiteName() || 'Not assigned'"></div>
                            </div>
                        </template>

                        <!-- Host IP / Hostname -->
                        <div class="config-item" style="margin-left: auto;">
                            <label x-text="$store.simulator.data?.mdns_hostname ? 'Hostname' : 'Host IP'">Host IP</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <span class="host-ip" x-text="$store.simulator.data?.mdns_hostname ? $store.simulator.data.mdns_hostname + '.local' : $store.app.localIP"></span>
                                <button class="copy-btn" @click="navigator.clipboard.writeText($store.simulator.data?.mdns_hostname ? $store.simulator.data.mdns_hostname + '.local' : $store.app.localIP)" title="Copy">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Emulator Toggle -->
                        <div class="config-item">
                            <label>Emulator</label>
                            <div class="toggle-switch" style="height: 32px;">
                                <div class="toggle-switch-track"
                                     :class="{ 'on': $store.simulator.data?.running, 'loading': $store.simulator.emulatorToggling }"
                                     @click="toggleEmulator()">
                                    <div class="toggle-switch-thumb"></div>
                                </div>
                                <span class="toggle-switch-status"
                                      :class="$store.simulator.emulatorToggling ? 'toggling' : ($store.simulator.data?.running ? 'running' : 'stopped')"
                                      x-text="$store.simulator.emulatorToggling ? ($store.simulator.data?.running ? 'Stopping\u2026' : 'Starting\u2026') : ($store.simulator.data?.running ? 'Online' : 'Offline')"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Controls Section -->
                <div class="section">
                    <!-- Modbus Site Simulation Status (synced with site) -->
                    <template x-if="$store.app.selectedProtocol === 'modbus' && $store.simulator.data?.running">
                        <div class="auto-row" x-data="siteSimulationStatus()">
                            <div class="controls-panel">
                                <template x-if="connectedSiteId">
                                    <div class="controls-row">
                                        <div class="site-sim-info">
                                            <span class="site-sim-label">Site Simulation</span>
                                            <span class="site-sim-site-name" x-text="connectedSiteName"></span>
                                        </div>
                                        <div class="site-sim-status" :class="{ 'running': siteSimRunning }">
                                            <span class="site-sim-scenario" x-text="siteScenarioLabel"></span>
                                            <span class="site-sim-speed" x-text="'@' + siteTimeMultiplier + 'x'"></span>
                                        </div>
                                        <span class="sim-time" x-text="siteSimulatedTime || 'Not started'"></span>
                                        <div class="control-group" style="margin-left: auto;">
                                            <span class="control-group-label">Simulation</span>
                                            <div class="toggle-switch">
                                                <div class="toggle-switch-track"
                                                     :class="{ 'on': siteSimRunning }"
                                                     @click="toggleSiteSimulation()">
                                                    <div class="toggle-switch-thumb"></div>
                                                </div>
                                                <span class="toggle-switch-status"
                                                      :class="siteSimRunning ? 'running' : 'stopped'"
                                                      x-text="siteSimRunning ? 'Running' : 'Stopped'"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="!connectedSiteId">
                                    <div style="color: var(--text-muted); font-size: var(--font-size-sm);">
                                        This device is not assigned to a site. Simulation is controlled at the site level.
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <!-- Modbus Offline Message -->
                    <template x-if="$store.app.selectedProtocol === 'modbus' && !$store.simulator.data?.running">
                        <div class="auto-row">
                            <div class="controls-panel">
                                <div style="color: var(--text-muted); font-size: var(--font-size-sm);">
                                    Start the emulator to enable simulation controls.
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- MQTT Controls -->
                    <template x-if="$store.app.selectedProtocol === 'mqtt'">
                        <div class="auto-row" x-data="mqttControls()">
                            <div class="controls-two-column">
                                <div class="controls-column-left">
                                    <div class="control-group">
                                        <span class="control-group-label">EV Connected</span>
                                        <div class="toggle-switch">
                                            <div class="toggle-switch-track"
                                                 :class="{ 'on': evConnected }"
                                                 @click="toggleEVConnected()">
                                                <div class="toggle-switch-thumb"></div>
                                            </div>
                                            <span class="toggle-switch-status"
                                                  :class="evConnected ? 'running' : 'stopped'"
                                                  x-text="evConnected ? 'Yes' : 'No'"></span>
                                        </div>
                                    </div>
                                    <div class="control-group">
                                        <span class="control-group-label">Awake</span>
                                        <div class="toggle-switch">
                                            <div class="toggle-switch-track"
                                                 :class="{ 'on': isAwake }"
                                                 @click="toggleWakeUp()">
                                                <div class="toggle-switch-thumb"></div>
                                            </div>
                                            <span class="toggle-switch-status"
                                                  :class="isAwake ? 'running' : 'stopped'"
                                                  x-text="isAwake ? 'Yes' : 'No'"></span>
                                        </div>
                                    </div>
                                    <div class="control-group">
                                        <span class="control-group-label">Mode</span>
                                        <select x-model="controlMode" @change="setControlMode()">
                                            <option value="CONTROLLABLE">Controllable</option>
                                            <option value="LIMITABLE">Limitable</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="controls-column-right">
                                    <div class="control-group vertical">
                                        <span class="control-group-label">Power Control</span>
                                        <div class="power-slider-container">
                                            <div class="power-slider-labels">
                                                <span x-text="`-${(maxDischarge / 1000).toFixed(0)} kW`"></span>
                                                <span>0</span>
                                                <span x-text="`${(maxCharge / 1000).toFixed(0)} kW`"></span>
                                            </div>
                                            <div class="power-slider-track">
                                                <div class="power-slider-center"></div>
                                                <input type="range" class="power-slider-input"
                                                       :min="-maxDischarge" :max="maxCharge"
                                                       :value="powerSliderValue" step="100"
                                                       @input="onPowerInput($event)"
                                                       @change="onPowerChange($event)">
                                            </div>
                                            <div :class="powerDisplayClass" x-text="powerDisplayValue"></div>
                                        </div>
                                    </div>
                                    <div class="control-group vertical">
                                        <span class="control-group-label">Battery State of Charge</span>
                                        <div class="soc-slider-container">
                                            <div class="soc-slider-labels">
                                                <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
                                            </div>
                                            <div class="soc-slider-track">
                                                <input type="range" class="soc-slider-input"
                                                       min="0" max="100" :value="socSliderValue" step="1"
                                                       @input="onSocInput($event)"
                                                       @change="onSocChange($event)">
                                            </div>
                                            <div :class="socDisplayClass" x-text="`${Math.round(socSliderValue)}%`"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- OCPP Controls -->
                    <template x-if="$store.app.selectedProtocol === 'ocpp'">
                        <div class="auto-row" x-data="ocppControls()">
                            <div class="controls-two-column">
                                <div class="controls-column-left">
                                    <div class="control-group">
                                        <span class="control-group-label">EV Connected</span>
                                        <div class="toggle-switch">
                                            <div class="toggle-switch-track"
                                                 :class="{ 'on': evConnected }"
                                                 @click="toggleEVConnected()">
                                                <div class="toggle-switch-thumb"></div>
                                            </div>
                                            <span class="toggle-switch-status"
                                                  :class="evConnected ? 'running' : 'stopped'"
                                                  x-text="evConnected ? 'Yes' : 'No'"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="controls-column-right">
                                    <div class="control-group vertical">
                                        <span class="control-group-label">Charging Power (drag to start charging)</span>
                                        <div class="power-slider-container">
                                            <div class="power-slider-labels">
                                                <span>0 (off)</span>
                                                <span x-text="maxPowerLabel"></span>
                                            </div>
                                            <div class="power-slider-track" style="background: linear-gradient(to right, rgba(100, 100, 100, 0.3) 0%, rgba(0, 200, 100, 0.3) 100%);">
                                                <input type="range" class="power-slider-input"
                                                       min="0" :max="maxPower"
                                                       :value="powerSliderValue" step="100"
                                                       :disabled="!evConnected"
                                                       @input="onPowerInput($event)"
                                                       @change="onPowerChange($event)">
                                            </div>
                                            <div :class="powerDisplayClass" x-text="powerDisplayValue"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- State Section (MQTT/OCPP) -->
                <template x-if="$store.app.selectedProtocol !== 'modbus'">
                    <div class="section" x-data="$store.app.selectedProtocol === 'mqtt' ? mqttState() : ocppState()">
                        <div class="section-title" x-text="$store.app.selectedProtocol === 'mqtt' ? 'V2X Charger State' : 'OCPP Charger State'"></div>
                        <div class="state-grid">
                            <template x-for="card in stateCards" :key="card.label">
                                <div class="state-card" :class="{ 'highlight': card.highlight }">
                                    <div class="state-label" x-text="card.label"></div>
                                    <div class="state-value"
                                         :class="card.colorClass || ''"
                                         :style="card.colorStyle || ''"
                                         x-text="card.value"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Connectors Section (OCPP) -->
                <template x-if="$store.app.selectedProtocol === 'ocpp'">
                    <div class="section" x-data="ocppState()">
                        <div class="section-title">Connectors</div>
                        <div class="connector-grid">
                            <template x-for="conn in connectors" :key="conn.id">
                                <div class="connector-card" :class="{ 'connector-system': conn.id === 0 }">
                                    <div class="connector-header">
                                        <span class="connector-id" x-text="`Connector ${conn.id}`"></span>
                                        <span class="connector-status"
                                              :class="conn.status?.toLowerCase()"
                                              x-text="conn.status"></span>
                                    </div>
                                    <div class="connector-details">
                                        <span x-text="`Power: ${(conn.currentPower || 0).toFixed(0)} W`"></span><br>
                                        <span x-text="`Energy: ${(conn.energyWh || 0).toFixed(0)} Wh`"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Debug Section (OCPP) -->
                <template x-if="$store.app.selectedProtocol === 'ocpp'">
                    <div class="section" x-data="ocppDebug()">
                        <div class="section-title" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none;" @click="debugOpen = !debugOpen; if (debugOpen) refresh()">
                            <svg :style="{ transform: debugOpen ? 'rotate(90deg)' : 'rotate(0deg)', transition: 'transform 0.15s' }" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l10 7-10 7z"/></svg>
                            <span>MeterValues Debug</span>
                            <button x-show="debugOpen" class="btn btn-action" style="padding: 0.2rem 0.5rem; font-size: 0.7rem;" @click.stop="refresh()">Refresh</button>
                        </div>
                        <div class="debug-panel" x-show="debugOpen">
                            <div class="debug-grid">
                                <div class="debug-card">
                                    <div class="debug-card-title">3-Phase Voltages</div>
                                    <div class="debug-values">
                                        <div class="debug-value-row"><span>L1:</span> <span x-text="formatVoltage('voltage_L1')"></span> V</div>
                                        <div class="debug-value-row"><span>L2:</span> <span x-text="formatVoltage('voltage_L2')"></span> V</div>
                                        <div class="debug-value-row"><span>L3:</span> <span x-text="formatVoltage('voltage_L3')"></span> V</div>
                                    </div>
                                </div>
                                <div class="debug-card">
                                    <div class="debug-card-title">3-Phase Currents</div>
                                    <div class="debug-values">
                                        <div class="debug-value-row"><span>L1:</span> <span x-text="formatCurrent('current_L1')"></span> A</div>
                                        <div class="debug-value-row"><span>L2:</span> <span x-text="formatCurrent('current_L2')"></span> A</div>
                                        <div class="debug-value-row"><span>L3:</span> <span x-text="formatCurrent('current_L3')"></span> A</div>
                                    </div>
                                </div>
                                <div class="debug-card">
                                    <div class="debug-card-title">Power & Energy</div>
                                    <div class="debug-values">
                                        <div class="debug-value-row"><span>Power:</span> <span x-text="formatPower()"></span> W</div>
                                        <div class="debug-value-row"><span>Energy:</span> <span x-text="formatEnergy()"></span> Wh</div>
                                    </div>
                                </div>
                            </div>
                            <div class="debug-json-section">
                                <div class="debug-card-title" style="margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                                    Sample MeterValues JSON
                                    <button class="copy-btn" :class="{ 'copied': copySuccess }" @click="copyJson()" title="Copy JSON to clipboard">
                                        <svg x-show="!copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                        </svg>
                                        <svg x-show="copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="20 6 9 17 4 12"></polyline>
                                        </svg>
                                    </button>
                                </div>
                                <pre class="debug-json" x-text="sampleJson"></pre>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Tabbed View Section (Modbus Inverters) -->
                <template x-if="$store.app.selectedProtocol === 'modbus'">
                    <div class="section" x-data="inverterDefaultTab()">
                        <!-- Tab Bar -->
                        <div class="simulator-view-tabs">
                            <button class="view-tab" :class="{ 'active': activeTab === 'default' }"
                                    @click="activeTab = 'default'">Default</button>
                            <button class="view-tab" :class="{ 'active': activeTab === 'registers' }"
                                    @click="activeTab = 'registers'">Registers</button>
                        </div>

                        <!-- Default Tab Content -->
                        <div x-show="activeTab === 'default'" class="default-tab-content">
                            <!-- Energy Meter Section -->
                            <div class="default-section">
                                <div class="default-section-title">Energy Meter</div>
                                <div class="meter-mini-display">
                                    <div class="meter-mini-power">
                                        <div class="meter-mini-label" x-text="meterPower >= 0 ? 'IMPORTING' : 'EXPORTING'"></div>
                                        <div class="meter-mini-value" :class="{ 'exporting': meterPower < 0 }">
                                            <span class="meter-mini-number" x-text="Math.abs(meterPower).toFixed(0)"></span>
                                            <span class="meter-mini-unit">W</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Battery Section -->
                            <div class="default-section">
                                <div class="default-section-title">Battery</div>
                                <div class="battery-container">
                                    <div class="battery-visual">
                                        <div class="battery-cap"></div>
                                        <div class="battery-body">
                                            <div class="battery-fill" :style="getBatteryFillStyle()"></div>
                                            <div class="battery-percentage" x-text="`${Math.round(batterySoc)}%`"></div>
                                        </div>
                                    </div>
                                    <div class="battery-controls">
                                        <div class="control-row">
                                            <span class="control-label">State of Charge</span>
                                            <div class="slider-container">
                                                <input type="range" class="default-slider soc-slider"
                                                       min="0" max="100" step="0.1"
                                                       :value="batterySoc"
                                                       :disabled="isSimulationRunning"
                                                       @mousedown="onSliderMouseDown('soc')"
                                                       @input="onSocInput($event.target.value)"
                                                       @change="onSocChange($event.target.value)">
                                            </div>
                                            <span class="control-value" x-text="`${batterySoc.toFixed(1)}%`"></span>
                                        </div>
                                        <div class="control-row">
                                            <span class="control-label">Power</span>
                                            <div class="slider-container">
                                                <input type="range" class="default-slider power-slider"
                                                       :min="-maxBatteryPower" :max="maxBatteryPower" step="100"
                                                       :value="batteryPower"
                                                       :disabled="isSimulationRunning"
                                                       @mousedown="onSliderMouseDown('batteryPower')"
                                                       @input="onBatteryPowerInput($event.target.value)"
                                                       @change="onBatteryPowerChange($event.target.value)">
                                            </div>
                                            <span class="control-value" :class="getBatteryPowerClass()"
                                                  x-text="formatBatteryPower()"></span>
                                        </div>
                                        <div class="control-row">
                                            <span class="control-label">Capacity</span>
                                            <div class="slider-container">
                                                <input type="range" class="default-slider capacity-slider"
                                                       min="2" max="300" step="1"
                                                       :value="batteryCapacityKWh"
                                                       @input="onBatteryCapacityInput($event.target.value)"
                                                       @change="onBatteryCapacityChange($event.target.value)">
                                            </div>
                                            <span class="control-value" x-text="`${batteryCapacityKWh.toFixed(0)} kWh`"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Solar PV Section -->
                            <div class="default-section">
                                <div class="default-section-title">Solar PV</div>
                                <div class="pv-container">
                                    <div class="sun-icon" :style="getSunGlowStyle()">
                                        <svg viewBox="0 0 100 100" width="80" height="80">
                                            <circle cx="50" cy="50" r="20" fill="#FFD700"/>
                                            <g stroke="#FFD700" stroke-width="3" stroke-linecap="round">
                                                <line x1="50" y1="10" x2="50" y2="22"/>
                                                <line x1="50" y1="78" x2="50" y2="90"/>
                                                <line x1="10" y1="50" x2="22" y2="50"/>
                                                <line x1="78" y1="50" x2="90" y2="50"/>
                                                <line x1="21.7" y1="21.7" x2="30.2" y2="30.2"/>
                                                <line x1="69.8" y1="69.8" x2="78.3" y2="78.3"/>
                                                <line x1="21.7" y1="78.3" x2="30.2" y2="69.8"/>
                                                <line x1="69.8" y1="30.2" x2="78.3" y2="21.7"/>
                                            </g>
                                        </svg>
                                    </div>
                                    <div class="pv-controls">
                                        <div class="control-row">
                                            <span class="control-label">Power Output</span>
                                            <div class="slider-container">
                                                <input type="range" class="default-slider pv-slider"
                                                       min="0" :max="maxPvPower" step="100"
                                                       :value="pvPower"
                                                       :disabled="isSimulationRunning"
                                                       @mousedown="onSliderMouseDown('pv')"
                                                       @input="onPvPowerInput($event.target.value)"
                                                       @change="onPvPowerChange($event.target.value)">
                                            </div>
                                            <span class="control-value pv-power" x-text="`${pvPower.toFixed(0)} W`"></span>
                                        </div>
                                        <div class="pv-power-display">
                                            <span class="pv-power-value" x-text="`${(pvPower / 1000).toFixed(2)} kW`"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                                            <span class="register-addr" x-text="reg.address"></span>
                                        </div>
                                        <div class="register-value">
                                            <span x-text="formatValue(reg)"></span>
                                            <span class="register-unit" x-text="reg.unit || ''"></span>
                                        </div>
                                        <div class="register-input">
                                            <input type="number" placeholder="Set" step="any"

                                            <button @click="writeRegister(reg.address)">Set</button>
                                        </div>
                                    </div>

                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <svg x-show="copySuccess" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="log-container" :class="{ 'ocpp-log': $store.app.selectedProtocol === 'ocpp' }">
                        <template x-if="$store.simulator.logs.length === 0">
                            <div class="log-empty">No activity yet</div>
                        </template>
                        <template x-for="log in $store.simulator.logs" :key="log.timestamp + log.operation">
                            <div class="log-entry">
                                <span class="log-time" x-text="formatTime(log.timestamp)"></span>
                                <span :class="getOpClass(log)" x-text="log.operation"></span>
                                <template x-if="log.address !== undefined">
                                    <span class="log-addr" x-text="log.address"></span>
                                </template>
                                <span class="log-values" x-text="formatDetails(log)"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- MQTT Clients Section -->
                <template x-if="$store.app.selectedProtocol === 'mqtt'">
                    <div class="section" x-data="mqttClients()" x-init="$store.simulator.loadClients()">

                            <template x-if="clients.length === 0">
                                <div class="log-empty">No clients connected</div>

                                    <div class="client-id" x-text="client.id"></div>
                                    <div class="client-detail">
                                        <span class="label">Address</span>
                                        <span class="value" x-text="client.remote_addr"></span>
                                    </div>
                                    <div class="client-detail">
                                        <span class="label">Subscriptions</span>
                                        <span class="value" x-text="client.subscription_count"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        </div><!-- /main-content -->
    </main>
    </div><!-- /app-body -->
    </div><!-- /app-container -->

    <!-- Update Modal -->
    <template x-if="$store.app.showUpdateModal">
        <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;">
            <div style="background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 1.5rem; min-width: 320px; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                        <path d="M21 21v-5h-5"/>

                    Software Update
                </h3>

                <div style="margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color);">

                        <span style="color: var(--text-primary); font-weight: 600;" x-text="'v' + $store.app.version"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 0.5rem 0;">

                            <span style="color: var(--text-muted);">Checking...</span>
                        </template>
                        <template x-if="!$store.app.updateChecking && $store.app.updateInfo">
                            <span :style="$store.app.updateAvailable ? 'color: var(--color-success); font-weight: 600;' : 'color: var(--text-primary);'"

                        <template x-if="!$store.app.updateChecking && !$store.app.updateInfo">
                            <span style="color: var(--text-muted);">Unknown</span>
                        </template>
                    </div>
                </div>

                <template x-if="$store.app.updateAvailable && !$store.app.updateApplying">
                    <div style="margin: 0 0 1rem 0;">
                        <p style="padding: 0.75rem; background: rgba(var(--color-success-rgb), 0.1); border-radius: var(--radius-md); color: var(--color-success); font-size: 0.875rem; margin: 0;">
                            A new version is available! Click Download to get it.
                        </p>
                        <template x-if="$store.app.updateInfo.release_notes">
                            <div style="margin-top: 0.75rem; padding: 0.75rem; background: var(--bg-tertiary); border-radius: var(--radius-md); font-size: 0.8rem;">
                                <div style="color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600;">What's new:</div>
                                <div style="color: var(--text-secondary); white-space: pre-line;" x-text="$store.app.updateInfo.release_notes"></div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="!$store.app.updateAvailable && !$store.app.updateChecking && $store.app.updateInfo && $store.app.updateInfo.latest_version?.match(/^[\d.]/)">
                    <div style="margin: 0 0 1rem 0;">
                        <p style="padding: 0.75rem; background: var(--bg-tertiary); border-radius: var(--radius-md); color: var(--text-secondary); font-size: 0.875rem; margin: 0;">
                            ✓ You're running the latest version.
                        </p>
                        <template x-if="$store.app.updateInfo.release_notes">
                            <div style="margin-top: 0.75rem; padding: 0.75rem; background: var(--bg-tertiary); border-radius: var(--radius-md); font-size: 0.8rem;">
                                <div style="color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600;">What's new:</div>
                                <div style="color: var(--text-secondary); white-space: pre-line;" x-text="$store.app.updateInfo.release_notes"></div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="!$store.app.updateAvailable && !$store.app.updateChecking && $store.app.updateInfo && $store.app.updateInfo.release_notes && !$store.app.updateInfo.latest_version?.match(/^[\d.]/)">
                    <p style="margin: 0 0 1rem 0; padding: 0.75rem; background: rgba(255,180,0,0.1); border-radius: var(--radius-md); color: #e6a700; font-size: 0.875rem;"
                       x-text="$store.app.updateInfo.release_notes">
                    </p>
                </template>

                <template x-if="$store.app.updateApplying">
                    <p style="margin: 0 0 1rem 0; padding: 0.75rem; background: rgba(var(--color-primary-rgb), 0.1); border-radius: var(--radius-md); color: var(--color-primary); font-size: 0.875rem;">
                        <span style="display: inline-block; animation: spin 1s linear infinite; margin-right: 0.5rem;">⟳</span>
                        Downloading and installing update...
                    </p>
                </template>

                <template x-if="$store.app.updateSuccess">
                    <div style="margin: 0 0 1rem 0; padding: 0.75rem; background: rgba(var(--color-success-rgb), 0.1); border-radius: var(--radius-md); color: var(--color-success); font-size: 0.875rem;">
                        <p style="margin: 0 0 0.5rem 0; font-weight: 600;">✓ Update installed successfully!</p>
                        <p style="margin: 0;">Please restart the application to use the new version.</p>
                    </div>
                </template>

                <template x-if="$store.app.updateError">
                    <div style="margin: 0 0 1rem 0; padding: 0.75rem; background: rgba(var(--color-error-rgb), 0.1); border-radius: var(--radius-md); color: var(--color-error); font-size: 0.875rem;">
                        <p style="margin: 0 0 0.5rem 0; font-weight: 600;">✗ Update failed</p>
                        <p style="margin: 0;" x-text="$store.app.updateError"></p>
                    </div>
                </template>

                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button @click="$store.app.showUpdateModal = false"
                            :disabled="$store.app.updateApplying"
                            class="btn btn-secondary">
                        Close
                    </button>
                    <button @click="$store.app.restartApp()"
                            x-show="$store.app.updateSuccess"
                            :disabled="$store.app.updateApplying"
                            class="btn btn-primary">
                        Restart Now
                    </button>
                    <button @click="$store.app.checkForUpdate()"
                            x-show="!$store.app.updateChecking && !$store.app.updateApplying"
                            class="btn btn-secondary">
                        Check Again
                    </button>
                    <button @click="$store.app.applyUpdate()"
                            x-show="$store.app.updateAvailable && !$store.app.updateApplying"
                            class="btn btn-primary">
                        Update Now
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Settings Modal -->

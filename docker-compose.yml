version: "3.8"

services:
  # Instance 1: Modbus 500, Dashboard 8000
  modbus-server-1:
    build: .
    ports:
      - "500:502"
    environment:
      - SERIAL_NUMBER=INVSIM00
    container_name: modbus-simulator-1

  webapp-1:
    build: ./webapp
    depends_on:
      - modbus-server-1
    environment:
      - MODBUS_HOST=modbus-server-1
      - MODBUS_PORT=502
      - MODBUS_UNIT_ID=1
    ports:
      - "8000:8000"
    container_name: inverter-webapp-1


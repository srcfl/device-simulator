services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"               # Web dashboard
      - "5100-5109:5100-5109" # Modbus TCP servers (5100+ to avoid macOS AirPlay conflict on 5000)
    environment:
      - NUM_INSTANCES=10
      - MODBUS_BASE_PORT=5100
      - HTTP_PORT=80
    container_name: device-simulator
    restart: unless-stopped

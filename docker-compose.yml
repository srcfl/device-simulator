services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    ports:
      - "80:80"               # Web dashboard
      - "5000-5009:5000-5009" # Modbus TCP servers
    environment:
      - NUM_INSTANCES=10
      - MODBUS_BASE_PORT=5000
      - HTTP_PORT=80
    container_name: device-simulator
    restart: unless-stopped

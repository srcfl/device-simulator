services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"               # Web dashboard
      - "5100-5104:5100-5104" # Modbus TCP servers (inverters)
      - "1883-1885:1883-1885" # MQTT brokers (V2X chargers)
      - "9000-9001:9000-9001" # OCPP WebSocket servers (OCPP chargers)
    environment:
      - NUM_INVERTERS=5
      - NUM_V2X_CHARGERS=3
      - NUM_OCPP_CHARGERS=2
      - MODBUS_BASE_PORT=5100
      - MQTT_PORT=1883
      - OCPP_BASE_PORT=9000
      - HTTP_PORT=80
      - HOST_IP=${HOST_IP:-}
    container_name: device-simulator
    restart: unless-stopped

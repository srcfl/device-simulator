name: Build Desktop Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_title:
        description: 'Release title'
        required: true
        default: 'Manual release'

# Ensure only one release workflow runs at a time (queue others)
concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: '1.22'

jobs:
  # First job: Check if this is a release commit and calculate version
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
      release_title: ${{ steps.check.outputs.release_title }}
      release_body: ${{ steps.check.outputs.release_body }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tags

      - name: Check commit message for release trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_type=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
            echo "release_title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
            echo "release_body=" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)

            # Check for release prefixes
            if [[ "$FIRST_LINE" =~ ^patch:\ ?(.+)$ ]]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "release_type=patch" >> $GITHUB_OUTPUT
              echo "release_title=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            elif [[ "$FIRST_LINE" =~ ^minor:\ ?(.+)$ ]]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "release_type=minor" >> $GITHUB_OUTPUT
              echo "release_title=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            elif [[ "$FIRST_LINE" =~ ^major:\ ?(.+)$ ]]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "release_type=major" >> $GITHUB_OUTPUT
              echo "release_title=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "release_type=" >> $GITHUB_OUTPUT
              echo "release_title=" >> $GITHUB_OUTPUT
            fi

            # Extract commit body (everything after first line, trimmed)
            # Use heredoc for multiline output (GitHub Actions recommended approach)
            COMMIT_BODY=$(echo "$COMMIT_MSG" | tail -n +2 | sed '/./,$!d' | sed -e :a -e '/^\s*$/d;N;ba' | sed '/^Co-Authored-By:/d' || true)
            DELIM="EOF_$(date +%s%N)"
            {
              echo "release_body<<$DELIM"
              echo "$COMMIT_BODY"
              echo "$DELIM"
            } >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: version
        if: steps.check.outputs.should_release == 'true'
        run: |
          # Fetch all tags from remote (tags created by releases may not be in checkout)
          git fetch --tags --force

          # Get latest tag by version sort (not ancestry) or default to v0.0.0
          # git describe only finds ancestor tags, but release tags are on different commits
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Strip 'v' prefix and parse version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Default to 0 if parsing fails
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Bump version based on release type
          case "${{ steps.check.outputs.release_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  # Run tests before building - must pass for release to proceed
  test:
    needs: check-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./... -v

  build-macos:
    needs: [check-release, test]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add to search list
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Verify certificate is available
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build macOS App
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          mkdir -p build/macos

          # Build binary with version
          CGO_ENABLED=1 CGO_LDFLAGS="-framework UniformTypeIdentifiers" \
            go build -tags "desktop,production" \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o build/macos/device-simulator \
            ./cmd/simulator/

          # Create .app bundle
          APP_NAME="Device Simulator"
          mkdir -p "build/macos/${APP_NAME}.app/Contents/MacOS"
          mkdir -p "build/macos/${APP_NAME}.app/Contents/Resources"
          mv build/macos/device-simulator "build/macos/${APP_NAME}.app/Contents/MacOS/"

          # Create wrapper script for desktop mode
          cat > "build/macos/${APP_NAME}.app/Contents/MacOS/device-simulator-wrapper" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/device-simulator" --desktop "$@"
          EOF
          chmod +x "build/macos/${APP_NAME}.app/Contents/MacOS/device-simulator-wrapper"

          # Create Info.plist
          cat > "build/macos/${APP_NAME}.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>device-simulator-wrapper</string>
              <key>CFBundleIdentifier</key>
              <string>io.srcful.device-simulator</string>
              <key>CFBundleName</key>
              <string>Device Simulator</string>
              <key>CFBundleDisplayName</key>
              <string>Device Simulator</string>
              <key>CFBundleIconFile</key>
              <string>iconfile</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Generate app icon from tracked PNG
          ICON_SOURCE="cmd/simulator/static/app-icon.png"
          ICONSET_DIR="$RUNNER_TEMP/appicon.iconset"
          mkdir -p "$ICONSET_DIR"
          sips -z 16 16 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_16x16.png"
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_16x16@2x.png"
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_32x32.png"
          sips -z 64 64 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_32x32@2x.png"
          sips -z 128 128 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_128x128.png"
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_128x128@2x.png"
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_256x256.png"
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_256x256@2x.png"
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_512x512.png"
          sips -z 1024 1024 "$ICON_SOURCE" --out "$ICONSET_DIR/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET_DIR" -o "build/macos/${APP_NAME}.app/Contents/Resources/iconfile.icns"

          # Create entitlements file for hardened runtime
          cat > build/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.network.server</key>
              <true/>
              <key>com.apple.security.network.client</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Sign macOS App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/macos/Device Simulator.app"
          IDENTITY="Developer ID Application: Sourceful Labs AB (${APPLE_TEAM_ID})"

          # Sign inner binaries first
          codesign --force --options runtime --sign "$IDENTITY" \
            --entitlements build/entitlements.plist \
            "$APP/Contents/MacOS/device-simulator"

          codesign --force --options runtime --sign "$IDENTITY" \
            --entitlements build/entitlements.plist \
            "$APP/Contents/MacOS/device-simulator-wrapper"

          # Sign the app bundle
          codesign --force --options runtime --sign "$IDENTITY" \
            --entitlements build/entitlements.plist \
            "$APP"

          # Verify signature
          codesign --verify --deep --strict "$APP"
          echo "Code signing complete"

      - name: Notarize macOS App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/macos/Device Simulator.app"

          # Create zip for notarization
          ditto -c -k --keepParent "$APP" build/macos/notarize.zip

          # Submit for notarization
          xcrun notarytool submit build/macos/notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          # Staple the ticket
          xcrun stapler staple "$APP"

          # Verify notarization
          spctl --assess --type execute --verbose "$APP"
          echo "Notarization complete"

          # Create final zip for release
          cd build/macos && zip -r "../device-simulator_darwin_amd64.zip" "Device Simulator.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-simulator-darwin
          path: build/device-simulator_darwin_amd64.zip

  build-linux:
    needs: [check-release, test]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-22.04  # Wails v2 requires webkit2gtk-4.0 (not available in 24.04)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Linux App
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          mkdir -p build/linux

          # Build desktop binary with version
          CGO_ENABLED=1 go build -tags "desktop,production" \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o build/linux/device-simulator \
            ./cmd/simulator/

          # Create launcher script
          cat > build/linux/device-simulator.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/device-simulator" --desktop "$@"
          EOF
          chmod +x build/linux/device-simulator.sh

          # Create .desktop file for Linux desktop integration
          cat > build/linux/device-simulator.desktop << 'EOF'
          [Desktop Entry]
          Name=Device Simulator
          Comment=Multi-protocol device simulator for energy systems
          Exec=device-simulator --desktop
          Terminal=false
          Type=Application
          Categories=Development;
          EOF

          # Create tarball (use consistent naming for selfupdate compatibility)
          cd build && tar -czvf device-simulator_linux_amd64.tar.gz linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-simulator-linux
          path: build/device-simulator_linux_amd64.tar.gz

  build-windows:
    needs: [check-release, test]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows App
        shell: pwsh
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path build\windows

          $env:CGO_ENABLED = "1"
          # Built with the "desktop" tag so the executable defaults to desktop
          # mode: double-clicking device-simulator.exe opens the native window
          # (no launcher .bat needed). Run with --desktop=false for headless mode.
          go build -tags "desktop,production" `
            -ldflags "-s -w -H windowsgui -X main.Version=$env:VERSION" `
            -o build\windows\device-simulator.exe `
            .\cmd\simulator\

          # Create zip (use consistent naming for selfupdate compatibility)
          Compress-Archive -Path build\windows\* -DestinationPath build\device-simulator_windows_amd64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-simulator-windows
          path: build/device-simulator_windows_amd64.zip

  release:
    needs: [check-release, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: v${{ needs.check-release.outputs.version }} - ${{ needs.check-release.outputs.release_title }}
          draft: false
          prerelease: false
          files: |
            artifacts/device-simulator-darwin/device-simulator_darwin_amd64.zip
            artifacts/device-simulator-linux/device-simulator_linux_amd64.tar.gz
            artifacts/device-simulator-windows/device-simulator_windows_amd64.zip
          body: |
            ## In this version:

            ${{ needs.check-release.outputs.release_body }}

            ## Downloads

            | Platform | File | Requirements |
            |----------|------|--------------|
            | macOS | `device-simulator_darwin_amd64.zip` | macOS 10.15+ |
            | Linux | `device-simulator_linux_amd64.tar.gz` | GTK3, WebKit2GTK |
            | Windows | `device-simulator_windows_amd64.zip` | WebView2 |

            ## Installation

            ### macOS
            1. Unzip and drag `Device Simulator.app` to Applications
            2. Double-click to run (app is signed and notarized)

            ### Linux
            ```bash
            tar -xzf device-simulator_linux_amd64.tar.gz
            sudo apt install libgtk-3-0 libwebkit2gtk-4.0-37  # Debian/Ubuntu
            ./linux/device-simulator.sh
            ```

            ### Windows
            1. Unzip and double-click `device-simulator.exe`
            2. WebView2 will auto-install if needed

            To run headless (HTTP server only, no window), open a terminal and run
            `device-simulator.exe --desktop=false`, then browse to http://localhost:8762
            Note: the released `.exe` is a GUI build, so it produces no console output and
            Ctrl+C will not stop it — control it from the web dashboard, or use the Docker
            image / `make build-windows-server` if you need console logs.
